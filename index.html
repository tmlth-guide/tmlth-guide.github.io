。彼からサイトランスにハマった人も多数。"}, "Vegas": {"d": "DJ Mag Top 100 入りの経験があり、複数の Tomorrowland に出演しているサイトランスDJ。"}, "Infected Mushroom": {"o": "イスラエル", "d": "1996年結成のサイトランスの伝説的デュオで、代表曲は「Becoming Insane」。サイケデリックでロックな一面も。土曜 Crystal Garden のトリ。"}, "Manuals": {"d": "Tomorrowland ベルギーと Tomorrowland Winter に出演経験あり。"}, "Nome.": {"d": "Tomorrowland ベルギーに出演経験あり。"}, "22 Bullets": {"o": "ベルギー", "d": "メインステージ的なストレートなエネルギーを持つベルギーのビッグルーム／EDM DJ。"}, "DubVision": {"o": "オランダ・ハーグ", "d": "プログレッシブハウスを鳴らすオランダの兄弟で、スーパーグループ HALŌ のメンバー。"}, "Yves V": {"o": "ベルギー", "d": "Tomorrowland の古参で、メインステージに立った初めてのベルギー人DJ。クラシックな Tomorrowland のお祭り感。"}, "Third Party": {"o": "イギリス・ロンドン", "d": "メロディ満載のプログレッシブハウスを作るイギリスのデュオで、HALŌ のメンバー。"}, "DVBBS": {"o": "カナダ", "d": "「Tsunami」で知られるカナダの兄弟。土曜 Codex のトリ。"}, "Halo": {"d": "注意：金曜の HALŌ とは綴りが違い（長音記号なし）、同じアーティストとは限りません。中国にも Halo という有名なハウスプロデューサーがいますが、どちらかは確認できていません。"}, "Mattn": {"o": "ベルギー", "d": "Tomorrowland 系のイベントでよく見かける、ビッグルーム／EDMのベルギー人DJ／プロデューサー。"}, "Kölsch": {"o": "デンマーク", "d": "温かくて懐かしく、壮大なメロディック・テクノ／ハウスが持ち味のデンマーク人プロデューサー。メインステージでは珍しい「美しい」路線で、強くおすすめ。"}, "R3HAB": {"o": "オランダ", "d": "数えきれないポップスをリミックスしてきた多作なポップEDMプロデューサー。日曜はメインステージ、その後 ARTBAT との貴重な B2B も。"}, "Alok": {"o": "ブラジル", "d": "「Hear Me Now」で知られるブラジルの国民的DJで、ブラジリアン・ベースの顔。最近はより温かいハウスも。"}, "Lost Frequencies": {"o": "ベルギー", "d": "「Are You With Me」「Where Are You Now」。やさしいトロピカル／ディープハウスで、大合唱の瞬間がたくさん。"}, "Swedish House Mafia": {"o": "スウェーデン", "d": "「Don't You Worry Child」「One」「Save the World」。伝説の3人組がフェスのフィナーレを飾ります。"}, "Agents Of Time": {"o": "イタリア", "d": "曲をかけるだけでなく、生演奏でメロディック・テクノを届けるイタリアの3人組。Afterlife 系。"}, "Morten": {"o": "デンマーク", "d": "David Guetta と「Future Rave」プロジェクトを始めたデンマークのDJ。Kevin de Vries との B2B は、ビッグステージ感とダークなテクノのぶつかり合いになりそう。"}, "Dino Lenny": {"o": "イタリア", "d": "エレガントなメロディックハウスを鳴らすイタリアのベテラン・ハウスDJ／プロデューサー。"}, "Maxi Meraki": {"o": "ベルギー", "d": "アフロ／メロディックハウスのベルギー人プロデューサー。温かくグルーヴィーで、最近とても人気。"}, "Améme": {"d": "アフロハウスを代表するDJ／プロデューサーの一人。豊かなドラムで体が自然に動きます。"}, "Honeyluv": {"o": "アメリカ", "d": "グルーヴィーで踊りやすいテックハウスを鳴らすアメリカの女性DJ。"}, "DJ Tennis": {"o": "イタリア", "d": "Life and Death レーベル主宰。インディーダンス／エレクトロニックで、少し切ないパーティーミュージック。センス派。"}, "Joris Voorn": {"o": "オランダ", "d": "名曲「Ringo」で知られるオランダのテクノ／ハウスの名手。緻密なミックスで「DJの中のDJ」。"}, "Krystal Klear": {"o": "アイルランド", "d": "ディスコ／ハウスを鳴らすアイルランドのDJで、代表曲は「Neutron Dance」。とにかくハッピーなグルーヴ。"}, "Angemi": {"d": "Tomorrowland メインステージにも出演したビッグルーム／EDM DJ。"}, "Whisnu Santika": {"o": "インドネシア", "d": "インドネシアで最も有名なEDM DJの一人で、ファンコットなど地元の要素をビッグルームに取り込みます。東南アジアのホームの盛り上がりに期待。"}, "Matisse & Sadko": {"o": "ロシア", "d": "Martin Garrix と多くの曲を共作したロシアの兄弟（「Together」「Forever」など）。HALŌ のメンバー。"}, "Lucas & Steve": {"o": "オランダ", "d": "Spinnin' Records 出身のオランダのデュオ。軽快で入りやすいフューチャーハウス。"}, "Laidback Luke": {"o": "オランダ", "d": "オランダ系フィリピン人のベテラン・エレクトロハウスDJで、Mixmash レーベル主宰。ミックスの技術は折り紙つき。"}, "Quintino": {"o": "オランダ", "d": "重くストレートで、思いきり暴れられるオランダのビッグルームDJ。"}, "Brennan Heart": {"o": "オランダ", "d": "「ハードスタイルの大統領」の一人とも呼ばれるレジェンド。日曜の Crystal Garden を壮大なメロディとハードなキックでしめくくります。"}, "Sabai": {"o": "アメリカ", "d": "メロディックベース／フューチャーベースのアメリカ人プロデューサー。やさしいのに重みがある音。"}, "Andromedik": {"o": "ベルギー", "d": "Liquicity 系のベルギーのドラムンベース・プロデューサー。メロディアスで、DnB入門にぴったり。"}, "Apashe": {"o": "ベルギー生まれ、カナダ拠点", "d": "オーケストラと重低音ベースを融合させた、映画のようなサウンド。代表曲は「No Twerk」。"}, "Netsky": {"o": "ベルギー", "d": "ベルギーのドラムンベースを代表する存在で、「Come Alive」で知られています。メロディが良くグルーヴも強い、DnB入門の決定版。"}, "Neon": {"d": "Tomorrowland Winter に出演経験あり。"}, "To Be Discovered": {"d": "公式タイムテーブルに文字どおり「To Be Discovered」と書かれています。シークレットゲストか未発表の出演者かもしれないので、当日チェックしましょう。"}, "AdamK": {"o": "カナダ", "d": "温かいメロディと安定したグルーヴを持つ、カナダのベテラン・プログレッシブハウスDJ（Adam K）。"}}, "vibe": {"fri": "メインはジャジーなハウスから Garrix まで。<b>Crystal Garden = トランスの夜</b>。Codex は夜にテックハウス、FREEDOM は夜にハード路線（ハードスタイル → トラップ）。", "sat": "<b>Crystal Garden = 一日中サイトランス</b>。FREEDOM はテクノとハードテクノ、Codex は夜にプログレッシブ／ビッグルーム。メインは DVLM と Steve Aoki がトリ。", "sun": "<b>Codex = ドラムンベース／ベースの夜</b>。FREEDOM はメロディック・テクノ、CORE はアフロ／ディスコの上品なグルーヴ、Crystal Garden はハードスタイルで締め。メインは Swedish House Mafia がフィナーレ。"}}}, "ko": {"ui": {"langName": "한국어", "nav_grid": "타임테이블", "nav_now": "지금", "nav_mine": "내 일정", "nav_djs": "DJ 도감", "nav_genre": "장르", "clock": "태국 {t}", "dayShort": ["금요일", "토요일", "일요일"], "dayLine": ["12/11 (금)", "12/12 (토)", "12/13 (일)"], "grid_hint": "칸을 누르면 DJ 소개를 볼 수 있어요. 메인스테이지 시간은 공식 이미지를 보고 추정한 것이라 ±10분 정도 차이가 날 수 있어요.", "all": "전체", "limited": "공개된 정보가 적은 아티스트예요. 신인이나 현지 아티스트일 가능성이 높으니 오히려 새로운 발견의 기회! 아래 장르는 <b>그날 이 스테이지의 흐름으로 추측한 것</b>이며, 아티스트의 공식 장르가 아니에요.", "guess_suffix": " (추정)", "other_sets": "다른 공연: ", "need_net": "미리듣기 링크는 인터넷이 필요해요", "pill_big": "헤드라이너", "pill_pick": "추천 발견", "pill_big_s": "빅네임", "pill_pick_s": "추천", "min": "{n}분", "fav_on": "♥ 내 일정에 추가됨", "fav_off": "♡ 내 일정에 추가", "partner_also": "♥ {p}도 이 공연을 보고 싶어 해요", "overlap_warn": "⚠︎ 이미 고른 {x}와(과) 시간이 겹쳐요", "b2b_note": "B2B(back-to-back) = 두 DJ가 한 무대에서 번갈아 곡을 트는 것. 보통 한정 조합이에요.", "can_hear": "이번에 들을 수 있는 아티스트", "t_removed": "내 일정에서 삭제했어요", "t_added_ov": "추가했어요 (시간 겹침)", "t_added": "내 일정에 추가했어요 ♥", "t_none": "아직 고른 공연이 없어요", "t_copied": "복사했어요. 상대에게 보내세요", "t_copy_manual": "박스 안의 텍스트를 직접 복사해 주세요", "t_bad_code": "읽을 수 없어요. TMLTH: 로 시작하는지 확인해 주세요", "t_imported": "{n}개 공연을 가져왔어요", "now_live": "태국 시간 · {d} 진행 중", "now_drag": "{d} · 드래그해서 원하는 시간에 각 스테이지에서 누가 공연하는지 확인하세요", "countdown": "개막까지 {n}일 남았어요.", "back_now": "현재로", "my_next": "내 다음 공연", "in_progress": "공연 중", "in_min": "{n}분 후", "stages": "전체 스테이지", "not_started": "아직 시작 전", "ended": "오늘 공연 종료", "tz_note": "모든 시간은 태국 시간(UTC+7)이에요. 한국보다 2시간 느려요.", "mine_empty": "아직 고른 공연이 없어요.<br>「타임테이블」에서 칸을 누르고 「♡ 내 일정에 추가」를 눌러 주세요.<br><br>두 사람이 각자 휴대폰으로 고른 뒤, 아래 「둘이서 공유」로 서로 가져오면 서로 보고 싶은 공연과 겹치는 시간을 한눈에 볼 수 있어요.", "me": "나", "both_want": "둘 다 보고 싶어 해요", "overlap_with": "⚠︎ {x}와(과) 겹침", "sync_title": "둘이서 공유", "sync_desc": "「내 목록 복사」를 눌러 그 텍스트를 상대에게 보내세요(카톡 OK). 상대가 아래 칸에 붙여넣고 「가져오기」를 누르면 타임테이블에 분홍색 ♥로 표시돼요. 계정이 필요 없고, 메시지를 보낼 때만 인터넷이 필요해요.", "copy_mine": "내 목록 복사", "partner_name": "상대 이름", "import_ph": "상대가 보낸 TMLTH:… 를 여기에 붙여넣기", "do_import": "상대 목록 가져오기", "clr_partner": "상대 목록 지우기", "clr_mine": "내 목록 지우기", "confirm_again": "한 번 더 눌러 확인", "local_note": "선택한 내용은 이 휴대폰의 브라우저에만 저장돼요. 브라우저 데이터를 지우면 함께 지워져요.", "partner_default": "파트너", "dj_search_ph": "DJ 이름, 국가, 장르로 검색…", "f_all": "전체", "f_pick": "⭐ 추천 발견", "f_big": "헤드라이너", "f_today": "{d} 출연", "f_lim": "정보가 적은 새 얼굴", "pick_note": "「추천 발견」은 유명 DJ만 아는 분들을 위한 목록이에요. 꼭 가장 유명한 건 아니지만 각 장르를 대표하는 아티스트라 입문하기 좋고, 라이브로 들을 가치가 있어요.", "n_artists": "{n}팀", "no_match": "조건에 맞는 DJ가 없어요", "lim_short": "공개 정보 적음 · 발굴 후보", "genre_intro": "유명 DJ만 알아도 전혀 이상하지 않아요. 메인스테이지는 대부분 Big Room / EDM이지만, 다른 스테이지는 각자의 「종교」가 있어요. 좋아하는 히트곡이 어떤 장르인지 알면 같은 장르의 새로운 이름을 찾을 수 있어요.", "routes_title": "유명 DJ에서 시작하는 발견 루트", "routes": ["<b>Martin Garrix / Swedish House Mafia</b>의 멜로디가 좋다면 →", "<b>Anyma / 어둡고 웅장한 느낌</b>이 좋다면 →", "<b>DVLM의 하드한 구간</b>이 좋다면 →", "<b>Vini Vici</b>가 좋다면 → 토요일 하루 종일 Crystal Garden, 마지막은", "<b>Lost Frequencies의 부드러움</b>이 좋다면 →", "<b>「Cola」 같은 클럽 그루브</b>가 좋다면 →", "<b>전혀 모르는 음악</b>에 도전하고 싶다면 (DnB, 오케스트라 베이스, 태국 테크노) →"], "k_feel": "어떤 소리: ", "k_bpm": "템포: ", "k_bpm_v": "약 {b} BPM", "k_like": "이런 걸 좋아한다면: ", "k_when": "이번에 어디서: ", "see_artists": "이번 {n}팀 보기 →", "bpm_note": "BPM = 1분당 박자 수. 숫자가 클수록 빨라요. 일반 팝송은 보통 100–120 정도예요.", "lang_title": "언어 / Language", "about_title": "소개 및 설치", "unofficial": "팬이 만든 비공식 타임테이블이며, Tomorrowland 공식과는 관련이 없어요. 시간은 공식 이미지를 바탕으로 정리했고(메인스테이지는 추정), 실제 시간은 공식 앱과 현장 안내를 확인해 주세요.", "install_title": "홈 화면에 추가하면 인터넷 없이도 쓸 수 있어요", "installed_ok": "✓ 홈 화면에서 열었어요. 오프라인으로 쓸 수 있어요.", "tab_ios": "iPhone", "tab_android": "Android", "ios_steps": ["<b>Safari</b>로 이 주소를 열기", "아래 「공유」 버튼(네모에 위쪽 화살표) 누르기. <b>안 보이면 먼저 「•••」를 누른 뒤 「공유」</b>", "아래로 스크롤해서 「<b>홈 화면에 추가</b>」 → 「추가」", "새 아이콘으로 한 번 열면 데이터가 휴대폰에 저장돼요"], "android_steps": ["<b>Chrome</b>으로 이 주소를 열기", "오른쪽 위 「⋮」 누르기", "「<b>홈 화면에 추가</b>」 또는 「<b>앱 설치</b>」 누르기", "새 아이콘으로 한 번 열면 데이터가 휴대폰에 저장돼요"], "inapp_warn": "⚠︎ 지금 앱 내장 브라우저(카카오톡, 인스타그램 등)에서 열려 있어서 홈 화면에 추가할 수 없어요. 오른쪽 위 메뉴에서 「다른 브라우저로 열기」를 눌러 Safari나 Chrome으로 열어 주세요.", "storage_note": "「내 일정」은 이 휴대폰에만 저장되고 업로드되지 않아요. iPhone에서는 Safari 탭과 홈 화면 아이콘의 데이터가 따로라서, 추가한 뒤에는 항상 아이콘으로 열어 주세요.", "update_note": "페이지가 업데이트되면 인터넷이 되는 곳에서 한 번 열기만 하면 자동으로 업데이트돼요. 출발 전에 호텔 Wi-Fi에서 한 번 더 열어 두세요.", "banner": "비공식 팬 제작 · 홈 화면에 추가하면 오프라인 사용 가능", "banner_btn": "방법", "close": "닫기"}, "content": {"genres": {"bigroom": {"n": "Big Room / EDM", "one": "메인스테이지의 대표 사운드. 거대한 드롭, 다 같이 점프, 불꽃놀이의 순간.", "feel": "빌드업 → 고조 → 한 박자 정적 → 베이스 폭발(드롭). 기억하기 쉬운 멜로디에 팝송도 자주 섞여요.", "like": "Martin Garrix 〈Animals〉, Dimitri Vegas & Like Mike, Afrojack", "when": "밤의 메인스테이지, 일요일 Crystal Garden"}, "prog": {"n": "Progressive House", "one": "Big Room보다 멜로디컬하고 따뜻하고 감동적. 떼창과 노을에 딱.", "feel": "피아노 코드, 서서히 커지는 신스, 감정이 쌓이는 구성. 시끄럽진 않지만 웅장해요.", "like": "Swedish House Mafia 〈Don't You Worry Child〉, Garrix 〈Forever〉, Avicii", "when": "금요일 HALŌ, 토요일 밤 Codex"}, "house": {"n": "House", "one": "댄스 음악의 「본가」. 쿵-치-쿵-치 4박자 비트로 계속 몸을 흔들게 돼요.", "feel": "안정적인 쿵-치-쿵-치, 소울이나 디스코 보컬 샘플이 많아요. 드롭보다 그루브로 춤추게 하는 음악.", "like": "Lost Frequencies, Kryder, Fisher", "when": "Papillon 3일 내내, 금요일 Codex"}, "techhouse": {"n": "Tech House", "one": "House의 그루브 + Techno의 묵직함. 통통 튀는 베이스라인의 클럽 사운드.", "feel": "베이스가 계속 움직이고, 타악기가 촘촘하고, 보컬은 짧은 구호의 반복이 많아요.", "like": "CamelPhat 〈Cola〉, Fisher 〈Losing It〉, John Summit", "when": "금요일 밤 Codex (Solardo, CamelPhat)"}, "melhouse": {"n": "Melodic / Deep House", "one": "부드럽고 살짝 우울하거나 몽환적인 House. 귀가 편안해요.", "feel": "따뜻한 코드, 몽환적인 보컬, 여유로운 템포. 오후나 쉬는 시간에 딱.", "like": "Lost Frequencies의 칠한 곡들, Bob Moses, Yotto", "when": "금요일 해질녘 Crystal Garden, 일요일 Papillon"}, "afro": {"n": "Afro House", "one": "아프리카 타악기 + House. 부족적인 느낌에 몸이 절로 움직여요.", "feel": "풍성한 드럼, 겹겹이 쌓인 리듬, 아프리카어 찬트가 자주 나와요.", "like": "Black Coffee, Keinemusik, Adam Port 〈Move〉", "when": "일요일 CORE (Maxi Meraki, Améme)"}, "meltechno": {"n": "Melodic Techno", "one": "요즘 가장 핫한 「어둡지만 아름다운」 전자음악. 웅장하고 최면적이고 영화 같아요.", "feel": "묵직하게 밀고 나가는 드럼과 천천히 펼쳐지는 큰 멜로디. 큰 드롭은 없지만 완전히 빠져들게 돼요.", "like": "Anyma, ARTBAT 〈Upperground〉, Afterlife 레이블", "when": "금요일 메인의 Kevin de Vries, 일요일 FREEDOM"}, "techno": {"n": "Techno", "one": "반복적이고 최면적이고 인더스트리얼. 그루브와 음색 변화가 핵심이에요.", "feel": "보컬은 적고 멜로디는 미니멀. 드럼과 소리의 미세한 변화로 계속 춤추게 해요.", "like": "Amelie Lens, Charlotte de Witte, Lilly Palmer", "when": "토요일 FREEDOM (Atmosphere)"}, "hardtechno": {"n": "Hard Techno", "one": "더 빠르고, 더 단단하고, 더 사나운 Techno. 지금 젊은 층이 가장 사랑하는 언더그라운드 사운드.", "feel": "아주 단단한 킥, 90년대 레이브나 트랜스 멜로디 조각이 자주 나와요. 체력 소모 큼.", "like": "Nico Moreno, Indira Paganotto", "when": "토요일 FREEDOM 마무리"}, "trance": {"n": "Trance", "one": "90–00년대 유럽의 클래식. 「마음이 끌어올려지는」 느낌.", "feel": "긴 빌드업, 고조되는 멜로디, 넓은 공간감과 감정의 해방(업리프팅).", "like": "Armin van Buuren, 초기 Tiësto, Above & Beyond", "when": "금요일 밤 내내 Crystal Garden"}, "psy": {"n": "Psytrance", "one": "사이키델릭하고 빠르고 빙글빙글 도는 느낌. 인도 고아의 히피 파티에서 시작됐어요.", "feel": "굴러가는 「쿵-칙-쿵-칙」 베이스 + 비틀리고 소용돌이치는 효과음. 다른 세계에 들어가는 느낌.", "like": "Vini Vici 〈The Tribe〉, Infected Mushroom", "when": "토요일 하루 종일 Crystal Garden"}, "hardstyle": {"n": "Hardstyle", "one": "네덜란드·벨기에의 하드한 전자음악. 킥이 「쿵—」 하고 일그러지며 엄청난 박력.", "feel": "초중량급 디스토션 킥 + 웅장한 멜로디. 관객 모두가 주먹을 흔들어요.", "like": "DVLM의 하드한 구간, Sub Zero Project, Brennan Heart", "when": "금요일 밤 FREEDOM, 토요일 메인, 일요일 Crystal Garden 마지막"}, "dnb": {"n": "Drum & Bass", "one": "영국에서 온 빠른 브레이크비트. 드럼은 빠르지만 베이스는 느려서, 뛰어도 되고 흔들어도 돼요.", "feel": "174 BPM의 브레이크비트에 묵직한 베이스라인. 반 속도로 흔들거나 전속력으로 뛰거나.", "like": "Netsky 〈Come Alive〉, Pendulum, Chase & Status", "when": "일요일 밤 Codex"}, "bass": {"n": "Bass / Dubstep", "one": "초저음이 주인공인 전자음악. 사납거나, 아주 영상미가 있거나.", "feel": "베이스가 으르렁대고, 일그러지고, 출렁여요(워블). 오케스트라나 영화음악 같은 사운드와 섞이기도.", "like": "Skrillex, Apashe, Excision", "when": "일요일 Codex"}, "trap": {"n": "Trap", "one": "힙합 리듬 + EDM 드롭. 점프와 헤드뱅잉에 최적.", "feel": "808 서브베이스, 빠른 하이햇, 힙합 구호.", "like": "DJ Snake 〈Turn Down for What〉, Yellow Claw 〈Shotgun〉", "when": "금요일 FREEDOM 마지막, 일요일 Codex 마지막"}, "disco": {"n": "Disco / Indie Dance", "one": "레트로 디스코, 펑크, 인디 일렉트로닉. 파티 느낌인데 세련됐어요.", "feel": "경쾌한 베이스, 빈티지 신스. 즐겁고 힘들지 않게 춤출 수 있어요.", "like": "Purple Disco Machine, Daft Punk", "when": "일요일 밤 CORE"}, "hardhouse": {"n": "Hard House / Hard Trance", "one": "영국에서 부활 중인 하드한 하우스/트랜스. 빠르고 신나요.", "feel": "빠른 킥, 통통 튀는 베이스, 향수를 부르는 레이브 멜로디.", "like": "Hannah Laing, Funk Tribu", "when": "토요일 FREEDOM, 금요일 CORE"}, "pop": {"n": "팝 EDM / 보컬", "one": "가수와 후렴이 있어서 들어 봤을 확률이 높아요.", "feel": "팝송 같지만 더 춤추기 좋고, 떼창 순간이 많아요.", "like": "Alan Walker 〈Faded〉, R3HAB, NERVO", "when": "메인스테이지"}, "party": {"n": "파티 명곡 / 떼창", "one": "장르 불문, 명곡이면 뭐든지. 목표는 모두가 함께 노래하는 것.", "feel": "80·90·00년대 히트곡, 팝송, 장르를 넘나드는 매시업. 즐거움이 최우선.", "like": "결혼식 뒤풀이의 마지막 한 시간 (근데 더 미친)", "when": "Moosebar 하루 종일"}, "live": {"n": "라이브 악기", "one": "곡을 트는 것만이 아니라 진짜 악기를 라이브로 연주해요.", "feel": "색소폰, 키보드, 베이스 등의 즉흥 연주가 전자 비트 위에 얹혀요.", "like": "밴드 라이브 느낌을 좋아하는 분", "when": "금요일 메인 오프닝 Goldfish, 일요일 Agents Of Time"}}, "dj": {"Goldfish": {"o": "남아프리카공화국", "d": "DJ를 하면서 색소폰, 키보드, 콘트라베이스를 라이브로 연주하는 남아공 듀오. 재즈 악기를 햇살 같은 딥하우스에 녹여내요. 개막 첫 순서라 오후 워밍업에 딱."}, "Rave Republic": {"o": "싱가포르 (스위스 + 호주 멤버)", "d": "싱가포르를 기반으로 한 듀오로, 아시아를 대표하는 EDM 듀오 중 하나. DJ Mag Top 100에도 여러 번 올랐어요. 하이에너지 빅룸, 팝 EDM, 하드한 믹스."}, "Youna": {"o": "벨기에", "d": "Tomorrowland 계열 행사에서 자주 보이는 벨기에 여성 DJ. 하우스와 하드한 댄스 음악 사이를 오가는 스타일."}, "Henri PFR": {"o": "벨기에", "d": "벨기에 토박이 DJ이자 Tomorrowland 메인스테이지 단골. 멜로디컬하고 듣기 편한 프로그레시브/퓨처 하우스."}, "Lilly Palmer": {"o": "스위스 출생, 독일 활동", "d": "최근 몇 년 사이 크게 뜬 여성 테크노 DJ. 강렬한 피크타임 테크노에 중독성 있는 멜로디나 보컬 훅을 얹는 게 특기라 SNS에서도 자주 화제가 돼요. 테크노 입문용으로 친절한 아티스트."}, "John Newman": {"o": "영국", "d": "〈Love Me Again〉으로 유명한 영국 가수이자 Rudimental 〈Feel the Love〉의 목소리. 요즘은 DJ 세트로 자기 히트곡과 하우스를 섞어서 떼창이 가득해요."}, "Kevin de Vries": {"o": "독일", "d": "Afterlife 레이블의 핵심 인물 중 하나이자 멜로딕 테크노의 대표 주자. 어둡고 웅장하고 추진력이 강해요. Anyma의 영화 같은 분위기를 좋아한다면 꼭 들어 보세요. 일요일엔 Morten과 B2B도 있어요."}, "HALŌ": {"o": "러시아 / 네덜란드 / 영국", "d": "2025년 결성된 슈퍼그룹. Matisse & Sadko(러시아 형제) + DubVision(네덜란드 형제) + Third Party(영국 듀오)가 합체해 감동적이고 유포릭한 프로그레시브 하우스를 들려줘요. 멜로디 위주의 Garrix를 좋아한다면 무조건 빠질 거예요."}, "Vini Vici": {"o": "이스라엘", "d": "사이트랜스를 전 세계 메인스테이지로 끌어올린 듀오. 대표곡 〈The Tribe〉, Armin van Buuren과의 〈Great Spirit〉. 사이키델릭하고 소용돌이치는 부족적인 사운드."}, "Alan Walker": {"o": "노르웨이", "d": "〈Faded〉〈Alone〉의 주인공. 마스크와 후드가 트레이드마크. 부드러운 멜로디와 떼창 순간이 가득해요."}, "Martin Garrix": {"o": "네덜란드", "d": "〈Animals〉로 데뷔해 DJ Mag 세계 1위를 여러 번 차지한 스타. 금요일 마지막 순서라 불꽃놀이는 거의 확정."}, "Flosstradamus": {"o": "미국", "d": "트랩 EDM의 선구자 중 하나로, 2010년대 트랩을 EDM 메인스트림으로 끌어온 핵심 인물. Yellow Claw와의 B2B는 엄청 터질 거예요."}, "Yellow Claw": {"o": "네덜란드", "d": "트랩, 베이스, 힙합을 넘나드는 암스테르담 듀오. 대표곡 〈Shotgun〉. 금요일엔 Flosstradamus와 B2B, 일요일엔 Codex 마지막 순서."}, "Da Tweekaz": {"o": "노르웨이", "d": "「해피」 하드스타일 듀오. 팝송이나 어릴 적 추억의 노래를 하드스타일로 바꾸는 게 특기예요. 하드스타일을 처음 경험하기에 가장 무섭지 않은 입구."}, "MANDY": {"o": "벨기에", "d": "Dirty Workz 소속의 벨기에 여성 하드스타일 DJ. 팝송의 하드 리믹스를 많이 만들었어요(Tiësto & Post Malone 〈Jackie Chan〉의 공식 하드 리믹스 등)."}, "Bassjackers": {"o": "네덜란드", "d": "네덜란드 빅룸/일렉트로를 대표하는 이름 중 하나이자 Tomorrowland 메인스테이지의 익숙한 얼굴. 묵직한 비트로 직진하는 에너지."}, "Honey Gee": {"d": "Tomorrowland 벨기에에서 Yves V가 호스트하는 스테이지(EDM/빅룸 계열)에 출연한 적이 있어요."}, "Raiden": {"o": "한국", "d": "많은 K-pop 아티스트와 작업한 한국 DJ/프로듀서(EXO 찬열과의 〈Yours〉 등). 팝 감성이 강한 EDM/퓨처 베이스."}, "Kryder": {"o": "영국", "d": "라디오 쇼 「Kryteria」를 진행하는 영국의 베테랑 하우스 DJ. 프로그레시브 출신으로 지금은 그루비한 하우스/테크 하우스 위주."}, "Funk Tribu": {"o": "콜롬비아 출신, 베를린 활동", "d": "〈Phonky Tribu〉로 유명해졌고, 요즘 인기인 「그루비 트랜스」의 대표 주자. 90–00년대 레트로 퓨처 감성 + 통통 튀는 리듬. 금요일 CORE 마지막 순서."}, "X CLUB.": {"o": "호주 (영국 거주)", "d": "90년대 테크노에서 출발해 브레이크비트, 정글, 트랜스를 섞는 호주 듀오. 차갑지 않은 「재미있는 테크노」."}, "Pegassi": {"o": "벨기에", "d": "벨기에 프로듀서 Sam Huybrecht의 프로젝트. 유로댄스, 트랜스, 테크노, 하우스를 섞어 향수를 자극하면서도 펀치가 있어요."}, "Hyalyte": {"d": "Tomorrowland Winter의 CORE 스테이지에 출연한 적이 있어요."}, "Ferry Corsten": {"o": "네덜란드", "d": "System F 〈Out of the Blue〉, Gouryella 등의 명곡으로 유명한 트랜스 레전드. 금요일 자정 Crystal Garden을 마무리하고, 그 전에 Marsh와의 B2B도 있어요."}, "Marsh": {"o": "영국", "d": "Anjunadeep / Anjunabeats 계열 프로듀서. 섬세하고 멜로디컬한 프로그레시브/딥 하우스로 해질녘에 딱이에요."}, "Aly & Fila": {"o": "이집트", "d": "「Future Sound of Egypt」를 이끄는 이집트 트랜스 듀오로, 피라미드 앞에서 공연한 적도 있어요. 고조되는 업리프팅 트랜스로, 트랜스 팬들에겐 신 같은 존재."}, "Cosmic Gate": {"o": "독일", "d": "1999년 결성된 독일 트랜스 듀오. 대표곡 〈Exploration of Space〉. 힘 있고 테크 성향의 트랜스."}, "Eli & Fur": {"o": "영국", "d": "영국 여성 듀오. 몽환적인 보컬 + 딥/멜로딕 하우스로, 부드러우면서 그루비해요."}, "Yotto": {"o": "핀란드", "d": "Anjunadeep 출신의 핀란드 프로듀서. 멜로딕 하우스/프로그레시브의 대표 주자로 멜로디가 깨끗하고 아름다워요."}, "CamelPhat": {"o": "영국 리버풀", "d": "〈Cola〉로 그래미 후보에 오른 듀오. 테크 하우스와 멜로딕 계열의 대표로, 클럽 분위기 최고조."}, "Solardo": {"o": "영국 맨체스터", "d": "Sola 레이블을 운영하는 영국 테크 하우스 듀오. 통통 튀는 베이스와 강한 리듬으로 춤추기 딱 좋아요."}, "Linska": {"o": "영국", "d": "요즘 급부상 중인 여성 DJ. 경쾌하고 펀치 있는 하우스/테크 하우스."}, "Lennert Wolfs": {"d": "Tomorrowland Winter에 출연한 적이 있어요."}, "Jelle DK": {"o": "벨기에", "d": "Moosebar 레지던트 DJ. Moosebar는 Tomorrowland의 캐나다 사냥 오두막 콘셉트 바로, 장르를 넘나드는 파티 명곡으로 떼창과 웃음이 가득한 곳이에요."}, "Jan V": {"o": "벨기에", "d": "3일 내내 나오는 Moosebar 레지던트. 지쳐서 한잔하고 싶거나, 추억의 히트곡으로 다 같이 노래하고 싶다면 Moosebar로."}, "Jerrooo": {"o": "벨기에", "d": "Tomorrowland 벨기에의 Moose Bar에도 꾸준히 나오는 레지던트. 파티 명곡과 장르를 넘나드는 매시업."}, "Ian Asher": {"o": "미국", "d": "경쾌하고 듣기 편한 하우스/퓨처 하우스를 트는 미국 DJ/프로듀서."}, "Miss Monique": {"o": "우크라이나", "d": "YouTube 「Mind Space」 시리즈로 인기를 얻은 우크라이나 여성 DJ. 아름답고 펀치 있는 프로그레시브/멜로딕 테크노로, 멜로딕 테크노 입문에 최고."}, "NERVO": {"o": "호주", "d": "호주 쌍둥이 자매이자 작곡가(David Guetta 〈When Love Takes Over〉 공동 작곡). 팝 감성의 신나는 EDM."}, "Sub Zero Project": {"o": "네덜란드", "d": "Defqon.1을 대표하는 네덜란드 하드스타일 듀오, 대표곡 〈The Project〉. 하드하지만 멜로디가 웅장해서 메인스테이지 하드스타일 입문으로 최고."}, "ARTBAT": {"o": "우크라이나", "d": "〈Upperground〉로 유명한 멜로딕 테크노 스타. 웅장하고 깊고 영화 같아요. 토요일 메인스테이지, 일요일엔 R3HAB과 B2B도."}, "Afrojack": {"o": "네덜란드", "d": "〈Take Over Control〉과 Pitbull 〈Give Me Everything〉의 프로듀서. 일렉트로/빅룸의 상징."}, "Dimitri Vegas & Like Mike": {"o": "벨기에 (그리스계 형제)", "d": "「Tomorrowland의 왕」으로 불리며 DJ Mag 세계 1위에도 올랐던 형제. 빅룸, 하드스타일, 팝송을 전부 섞는 초화려한 쇼."}, "Steve Aoki": {"o": "미국", "d": "Dim Mak 레이블 창립자로, 무대에서 케이크를 던지는 걸로 유명해요. EDM, 록, 힙합을 넘나들어요. 토요일 마지막 순서."}, "Nakadia": {"o": "태국 (베를린 활동)", "d": "베를린에서 활동하는 태국 여성 테크노 DJ로, 국제 테크노 씬에서 몇 안 되는 태국 출신 아티스트. 이번엔 금의환향 공연이라 감동적인 세트가 될 것 같아요."}, "Amber Broos": {"o": "벨기에", "d": "Tomorrowland 단골인 벨기에의 젊은 여성 테크노 DJ. 에너지 넘치는 피크타임 테크노."}, "Space 92": {"o": "프랑스", "d": "스케일 크고 인더스트리얼하며 폭발력 있는 사운드의 프랑스 테크노 프로듀서."}, "Hannah Laing": {"o": "영국 스코틀랜드", "d": "영국 하드 하우스/하드 트랜스 부활을 대표하는 여성 DJ. 빠르고 신나니 체력 준비 필수."}, "Nico Moreno": {"o": "프랑스", "d": "프랑스 하드 테크노의 대표 주자. 빠르고 사나운, 지금 가장 핫한 하드 테크노 이름 중 하나."}, "Luuk van Dijk": {"o": "네덜란드", "d": "디스코와 레트로 요소를 더한 하우스/테크 하우스를 트는 네덜란드 DJ. 그루브가 넘쳐요."}, "DJ Boring": {"o": "호주 출생, 런던 활동", "d": "로파이 하우스 명곡 〈Winona〉로 떴어요. 최근 세트는 더 빠르고 레이브스러워졌지만 향수 어린 따뜻함은 그대로."}, "Mind Against": {"o": "이탈리아", "d": "Afterlife 계열의 이탈리아 형제로, 멜로딕 테크노의 명인. 깊고 어둡고 분위기 있어요. 토요일 CORE 마지막 순서."}, "Firaga": {"d": "Tomorrowland 벨기에의 사이트랜스 스테이지(Planaxis)에 출연한 적이 있어요."}, "Ghost Rider": {"o": "이스라엘", "d": "프로그레시브/풀온 계열의 사이키델릭한 스타일을 가진 이스라엘 사이트랜스 프로듀서."}, "Blastoyz": {"o": "이스라엘", "d": "멜로디컬하고 대중적인 사이트랜스를 만드는 이스라엘 프로듀서. 그를 통해 사이트랜스에 입문한 사람이 많아요."}, "Vegas": {"d": "DJ Mag Top 100에 든 적이 있고, 여러 Tomorrowland에 출연한 사이트랜스 DJ."}, "Infected Mushroom": {"o": "이스라엘", "d": "1996년 결성된 사이트랜스 레전드 듀오, 대표곡 〈Becoming Insane〉. 사이키델릭하면서 록 같은 면도 있어요. 토요일 Crystal Garden 마지막 순서."}, "Manuals": {"d": "Tomorrowland 벨기에와 Tomorrowland Winter에 출연한 적이 있어요."}, "Nome.": {"d": "Tomorrowland 벨기에에 출연한 적이 있어요."}, "22 Bullets": {"o": "벨기에", "d": "메인스테이지 스타일의 직진 에너지를 가진 벨기에 빅룸/EDM DJ."}, "DubVision": {"o": "네덜란드 헤이그", "d": "프로그레시브 하우스를 하는 네덜란드 형제이자 슈퍼그룹 HALŌ의 멤버."}, "Yves V": {"o": "벨기에", "d": "Tomorrowland의 원년 멤버이자 메인스테이지에 처음 오른 벨기에 DJ. 클래식한 Tomorrowland 축제 에너지."}, "Third Party": {"o": "영국 런던", "d": "멜로디가 가득한 프로그레시브 하우스를 만드는 영국 듀오이자 HALŌ의 멤버."}, "DVBBS": {"o": "캐나다", "d": "〈Tsunami〉로 유명한 캐나다 형제. 토요일 Codex 마지막 순서."}, "Halo": {"d": "주의: 금요일의 HALŌ와 철자가 달라서(장음 기호 없음) 같은 팀이 아닐 수도 있어요. 중국에도 Halo라는 유명한 하우스 프로듀서가 있지만, 누구인지는 확인할 수 없어요."}, "Mattn": {"o": "벨기에", "d": "Tomorrowland 계열 행사에서 자주 보이는 빅룸/EDM 벨기에 DJ/프로듀서."}, "Kölsch": {"o": "덴마크", "d": "따뜻하고 향수를 자극하며 웅장한 멜로딕 테크노/하우스가 특기인 덴마크 프로듀서. 메인스테이지에서 보기 드문 「아름다운」 노선이라 강력 추천."}, "R3HAB": {"o": "네덜란드", "d": "수많은 팝송을 리믹스한 다작 팝 EDM 프로듀서. 일요일 메인스테이지 후 ARTBAT과의 보기 드문 B2B도 있어요."}, "Alok": {"o": "브라질", "d": "〈Hear Me Now〉로 유명한 브라질 국민 DJ이자 브라질리언 베이스의 얼굴. 요즘은 더 따뜻한 하우스도 해요."}, "Lost Frequencies": {"o": "벨기에", "d": "〈Are You With Me〉〈Where Are You Now〉. 부드러운 트로피컬/딥 하우스로 떼창 순간이 많아요."}, "Swedish House Mafia": {"o": "스웨덴", "d": "〈Don't You Worry Child〉〈One〉〈Save the World〉. 전설의 3인조가 폐막 무대를 장식해요."}, "Agents Of Time": {"o": "이탈리아", "d": "곡을 트는 것만이 아니라 라이브 연주로 멜로딕 테크노를 들려주는 이탈리아 3인조. Afterlife 계열."}, "Morten": {"o": "덴마크", "d": "David Guetta와 함께 「Future Rave」 프로젝트를 시작한 덴마크 DJ. Kevin de Vries와의 B2B는 빅스테이지 에너지와 어두운 테크노의 충돌이 될 거예요."}, "Dino Lenny": {"o": "이탈리아", "d": "우아한 멜로딕 하우스를 들려주는 이탈리아 베테랑 하우스 DJ/프로듀서."}, "Maxi Meraki": {"o": "벨기에", "d": "아프로/멜로딕 하우스를 하는 벨기에 프로듀서. 따뜻하고 그루비해서 요즘 아주 인기예요."}, "Améme": {"d": "아프로 하우스를 대표하는 DJ/프로듀서 중 한 명. 풍성한 드럼으로 몸이 절로 움직여요."}, "Honeyluv": {"o": "미국", "d": "그루비하고 춤추기 좋은 테크 하우스를 트는 미국 여성 DJ."}, "DJ Tennis": {"o": "이탈리아", "d": "Life and Death 레이블 대표. 인디 댄스/일렉트로닉으로, 살짝 우울한 감성의 파티 음악. 센스파."}, "Joris Voorn": {"o": "네덜란드", "d": "명곡 〈Ringo〉로 유명한 네덜란드 테크노/하우스 명인. 섬세한 믹스로 「DJ들의 DJ」."}, "Krystal Klear": {"o": "아일랜드", "d": "디스코/하우스를 트는 아일랜드 DJ, 대표곡 〈Neutron Dance〉. 엄청 신나는 그루브."}, "Angemi": {"d": "Tomorrowland 메인스테이지에도 오른 빅룸/EDM DJ."}, "Whisnu Santika": {"o": "인도네시아", "d": "인도네시아에서 가장 유명한 EDM DJ 중 한 명으로, 펑콧 등 현지 요소를 빅룸에 녹여내요. 동남아 홈 분위기가 기대돼요."}, "Matisse & Sadko": {"o": "러시아", "d": "Martin Garrix와 여러 곡을 함께 만든 러시아 형제(〈Together〉〈Forever〉 등). HALŌ의 멤버."}, "Lucas & Steve": {"o": "네덜란드", "d": "Spinnin' Records 출신 네덜란드 듀오. 경쾌하고 듣기 편한 퓨처 하우스."}, "Laidback Luke": {"o": "네덜란드", "d": "네덜란드계 필리핀인 베테랑 일렉트로 하우스 DJ이자 Mixmash 레이블 대표. 믹싱 실력이 탁월해요."}, "Quintino": {"o": "네덜란드", "d": "묵직하고 직설적이라 마음껏 뛰기 좋은 네덜란드 빅룸 DJ."}, "Brennan Heart": {"o": "네덜란드", "d": "「하드스타일의 대통령」 중 한 명으로 불리는 레전드. 웅장한 멜로디와 하드한 킥으로 일요일 Crystal Garden을 마무리해요."}, "Sabai": {"o": "미국", "d": "멜로딕 베이스/퓨처 베이스를 하는 미국 프로듀서. 부드럽지만 무게감 있는 사운드."}, "Andromedik": {"o": "벨기에", "d": "Liquicity 계열 벨기에 드럼 앤 베이스 프로듀서. 멜로디컬해서 DnB 입문에 딱."}, "Apashe": {"o": "벨기에 출생, 캐나다 활동", "d": "오케스트라와 묵직한 베이스를 결합해 영화 같은 사운드를 만들어요. 대표곡 〈No Twerk〉."}, "Netsky": {"o": "벨기에", "d": "벨기에 드럼 앤 베이스의 대표 인물, 〈Come Alive〉로 유명해요. 멜로디도 좋고 그루브도 강한 DnB 입문의 정석."}, "Neon": {"d": "Tomorrowland Winter에 출연한 적이 있어요."}, "To Be Discovered": {"d": "공식 타임테이블에 정말로 「To Be Discovered」라고 적혀 있어요. 시크릿 게스트이거나 미발표 공연일 수 있으니 당일 확인하세요."}, "AdamK": {"o": "캐나다", "d": "따뜻한 멜로디와 안정적인 그루브를 가진 캐나다 베테랑 프로그레시브 하우스 DJ(Adam K)."}}, "vibe": {"fri": "메인은 재즈풍 하우스부터 Garrix까지. <b>Crystal Garden = 트랜스의 밤</b>. Codex는 밤에 테크 하우스, FREEDOM은 밤에 하드 노선(하드스타일 → 트랩).", "sat": "<b>Crystal Garden = 하루 종일 사이트랜스</b>. FREEDOM은 테크노와 하드 테크노, Codex는 밤에 프로그레시브/빅룸. 메인은 DVLM과 Steve Aoki가 마무리.", "sun": "<b>Codex = 드럼 앤 베이스/베이스의 밤</b>. FREEDOM은 멜로딕 테크노, CORE는 아프로/디스코의 우아한 그루브, Crystal Garden은 하드스타일로 마무리. 메인은 Swedish House Mafia가 피날레."}}}, "es": {"ui": {"langName": "Español", "nav_grid": "Horarios", "nav_now": "Ahora", "nav_mine": "Mi plan", "nav_djs": "DJs", "nav_genre": "Géneros", "clock": "Tailandia {t}", "dayShort": ["Vie", "Sáb", "Dom"], "dayLine": ["11 dic", "12 dic", "13 dic"], "grid_hint": "Toca cualquier set para ver la info del DJ. Los horarios del Mainstage están estimados a partir de la imagen oficial y pueden variar ±10 min.", "all": "Todos", "limited": "Hay poca información pública sobre este artista: probablemente sea alguien nuevo o local, así que es una gran oportunidad para descubrirlo. Los géneros de abajo están <b>deducidos de lo que suena en este escenario ese día</b>; no son el estilo oficial del artista.", "guess_suffix": " (estimado)", "other_sets": "También toca: ", "need_net": "Los enlaces para escuchar necesitan internet", "pill_big": "Cabeza de cartel", "pill_pick": "Para descubrir", "pill_big_s": "Top", "pill_pick_s": "Descubre", "min": "{n} min", "fav_on": "♥ En mi plan", "fav_off": "♡ Añadir a mi plan", "partner_also": "♥ {p} también quiere verlo", "overlap_warn": "⚠︎ Se solapa con {x}, que ya elegiste", "b2b_note": "B2B (back-to-back) = dos DJs comparten cabina y se turnan para pinchar. Suele ser una combinación única.", "can_hear": "Tocan este fin de semana", "t_removed": "Quitado de mi plan", "t_added_ov": "Añadido (se solapa)", "t_added": "Añadido a mi plan ♥", "t_none": "Todavía no has elegido ningún set", "t_copied": "Copiado: envíaselo a tu pareja", "t_copy_manual": "Copia manualmente el texto del cuadro", "t_bad_code": "No se pudo leer. Debe empezar por TMLTH:", "t_imported": "{n} sets importados", "now_live": "Hora de Tailandia · {d} en curso", "now_drag": "{d} · Arrastra para ver qué suena en cada escenario a cualquier hora", "countdown": "Faltan {n} días.", "back_now": "Volver a ahora", "my_next": "Mi próximo set", "in_progress": "En directo", "in_min": "en {n} min", "stages": "Escenarios", "not_started": "Aún no empieza", "ended": "Terminado por hoy", "tz_note": "Todos los horarios son en hora de Tailandia (UTC+7).", "mine_empty": "Todavía no has elegido sets.<br>En Horarios, toca un set y pulsa «♡ Añadir a mi plan».<br><br>Cada uno puede elegir en su móvil y luego intercambiar listas con «Sincronizar con tu pareja» para ver lo que quiere ver el otro y los solapes.", "me": "Yo", "both_want": "Los dos queréis verlo", "overlap_with": "⚠︎ Se solapa con {x}", "sync_title": "Sincronizar con tu pareja", "sync_desc": "Pulsa «Copiar mi lista» y envía el texto a tu pareja (por cualquier app de mensajes). Tu pareja lo pega en el cuadro de abajo y pulsa Importar: tus elecciones aparecerán con un ♥ rosa en su horario. No hace falta cuenta; solo necesitas internet para enviar el mensaje.", "copy_mine": "Copiar mi lista", "partner_name": "Nombre de tu pareja", "import_ph": "Pega aquí el texto TMLTH:… que te envió tu pareja", "do_import": "Importar lista", "clr_partner": "Borrar lista de pareja", "clr_mine": "Borrar la mía", "confirm_again": "Pulsa otra vez para confirmar", "local_note": "Tus elecciones solo se guardan en el navegador de este móvil. Si borras los datos del navegador, se pierden.", "partner_default": "Pareja", "dj_search_ph": "Busca DJ, país, género…", "f_all": "Todos", "f_pick": "⭐ Para descubrir", "f_big": "Cabezas de cartel", "f_today": "Toca el {d}", "f_lim": "Caras nuevas (poca info)", "pick_note": "«Para descubrir» es para quien solo conoce a los grandes nombres. No siempre son los más famosos, pero cada uno representa muy bien su género: fáciles de disfrutar y vale la pena verlos en directo.", "n_artists": "{n} artistas", "no_match": "No hay DJs que coincidan", "lim_short": "Poca info pública · para descubrir", "genre_intro": "Es totalmente normal conocer solo a los DJs más famosos. El Mainstage es casi todo Big Room / EDM, pero cada escenario tiene su propia «religión». Mira a qué estilo pertenecen tus temas favoritos y busca nombres nuevos del mismo estilo.", "routes_title": "Rutas de descubrimiento desde lo conocido", "routes": ["¿Te gustan las melodías de <b>Martin Garrix / Swedish House Mafia</b>? →", "¿Te gusta <b>Anyma / lo oscuro y épico</b>? →", "¿Te gustan <b>las partes duras de DVLM</b>? →", "¿Te gusta <b>Vini Vici</b>? → Crystal Garden todo el sábado, con cierre de", "¿Te gusta <b>el lado suave de Lost Frequencies</b>? →", "¿Te gusta <b>el groove de club tipo «Cola»</b>? →", "¿Quieres probar <b>algo totalmente nuevo</b> (DnB, bass orquestal, techno tailandés)? →"], "k_feel": "Cómo suena: ", "k_bpm": "Tempo: ", "k_bpm_v": "unos {b} BPM", "k_like": "Si te gusta: ", "k_when": "Dónde escucharlo: ", "see_artists": "Ver los {n} artistas de este fin de semana →", "bpm_note": "BPM = pulsaciones por minuto; cuanto más alto, más rápido. La mayoría de canciones pop rondan 100–120.", "lang_title": "Idioma / Language", "about_title": "Info e instalación", "unofficial": "Este es un horario no oficial hecho por fans y no tiene relación con Tomorrowland. Los horarios salen de las imágenes oficiales publicadas (los del Mainstage son estimados); consulta siempre la app oficial y los avisos en el recinto.", "install_title": "Añádelo a la pantalla de inicio para usarlo sin conexión", "installed_ok": "✓ Abierto desde la pantalla de inicio: funciona sin conexión.", "tab_ios": "iPhone", "tab_android": "Android", "ios_steps": ["Abre esta URL en <b>Safari</b>", "Toca el botón Compartir (cuadrado con flecha hacia arriba). <b>¿No lo ves? Toca primero «•••» y luego «Compartir»</b>", "Desliza hacia abajo y toca «<b>Añadir a pantalla de inicio</b>» → «Añadir»", "Ábrelo una vez desde el icono nuevo para que se guarden los datos"], "android_steps": ["Abre esta URL en <b>Chrome</b>", "Toca «⋮» arriba a la derecha", "Toca «<b>Añadir a pantalla de inicio</b>» o «<b>Instalar aplicación</b>»", "Ábrelo una vez desde el icono nuevo para que se guarden los datos"], "inapp_warn": "⚠︎ Estás en el navegador interno de una app (por ejemplo Instagram o WhatsApp), que no permite añadir a la pantalla de inicio. Usa el menú de arriba a la derecha para «Abrir en el navegador» y ábrelo en Safari o Chrome.", "storage_note": "«Mi plan» solo se guarda en este móvil y nunca se sube. En iPhone, las pestañas de Safari y el icono de inicio guardan datos por separado: después de instalarlo, ábrelo siempre desde el icono.", "update_note": "Cuando la página se actualice, ábrela una vez con conexión y se actualizará sola. Ábrela otra vez con el Wi-Fi del hotel antes de ir.", "banner": "Guía no oficial hecha por fans · Añádela al inicio para usarla sin conexión", "banner_btn": "Cómo", "close": "Cerrar"}, "content": {"genres": {"bigroom": {"n": "Big Room / EDM", "one": "El sonido típico del Mainstage: drops enormes, todo el mundo saltando, momentos de fuegos artificiales.", "feel": "Subida → tensión → un silencio de un tiempo → explota el bajo (el drop). Melodías pegadizas, a menudo mezcladas con pop.", "like": "Martin Garrix «Animals», Dimitri Vegas & Like Mike, Afrojack", "when": "Mainstage por la noche, Crystal Garden el domingo"}, "prog": {"n": "Progressive House", "one": "Más melódico, cálido y emotivo que el Big Room. Perfecto para cantar a coro y para el atardecer.", "feel": "Acordes de piano, sintes que crecen, emoción que se va acumulando; no tan ruidoso, pero muy épico.", "like": "Swedish House Mafia «Don't You Worry Child», Garrix «Forever», Avicii", "when": "HALŌ el viernes, Codex el sábado por la noche"}, "house": {"n": "House", "one": "La raíz de la música de baile: un bombo constante a negras que no te deja parar.", "feel": "Un pum-chas-pum-chas estable, a menudo con samples vocales de soul o disco. Va de groove, no de drops.", "like": "Lost Frequencies, Kryder, Fisher", "when": "Papillon todo el fin de semana, Codex el viernes"}, "techhouse": {"n": "Tech House", "one": "El groove del House + la profundidad del Techno, con líneas de bajo que rebotan. Puro ambiente de club.", "feel": "Bajo siempre en movimiento, percusión densa, voces que suelen repetir una sola frase.", "like": "CamelPhat «Cola», Fisher «Losing It», John Summit", "when": "Codex el viernes por la noche (Solardo, CamelPhat)"}, "melhouse": {"n": "Melodic / Deep House", "one": "House suave, algo melancólico o soñador, muy agradable de escuchar.", "feel": "Acordes cálidos, voces etéreas, sin prisa. Ideal para la tarde o para descansar.", "like": "Los temas más chill de Lost Frequencies, Bob Moses, Yotto", "when": "Crystal Garden el viernes al atardecer, Papillon el domingo"}, "afro": {"n": "Afro House", "one": "Percusión africana + House: sensación tribal y mucho movimiento corporal.", "feel": "Baterías ricas, ritmos en capas, a menudo con cantos en lenguas africanas.", "like": "Black Coffee, Keinemusik, Adam Port «Move»", "when": "CORE el domingo (Maxi Meraki, Améme)"}, "meltechno": {"n": "Melodic Techno", "one": "El sonido «oscuro pero precioso» de los últimos años: épico, hipnótico, cinematográfico.", "feel": "Baterías profundas que empujan y grandes melodías que se abren poco a poco. Sin gran drop, pero te atrapa por completo.", "like": "Anyma, ARTBAT «Upperground», el sello Afterlife", "when": "Kevin de Vries en el Mainstage el viernes, FREEDOM el domingo"}, "techno": {"n": "Techno", "one": "Repetitivo, hipnótico, industrial. Todo gira en torno al groove y a la evolución del sonido.", "feel": "Pocas voces y melodía mínima; pequeños cambios en la batería y las texturas te mantienen bailando.", "like": "Amelie Lens, Charlotte de Witte, Lilly Palmer", "when": "FREEDOM el sábado (Atmosphere)"}, "hardtechno": {"n": "Hard Techno", "one": "Techno más rápido, más duro y más feroz: el sonido underground favorito de hoy.", "feel": "Bombos muy duros, a menudo con fragmentos de melodías rave o trance de los 90. Exige mucha energía.", "like": "Nico Moreno, Indira Paganotto", "when": "Cierre de FREEDOM el sábado"}, "trance": {"n": "Trance", "one": "Un clásico europeo de los 90 y 2000: la sensación de que te elevan el corazón.", "feel": "Subidas largas, melodías que vuelan, mucho espacio y liberación emocional (uplifting).", "like": "Armin van Buuren, el primer Tiësto, Above & Beyond", "when": "Crystal Garden todo el viernes por la noche"}, "psy": {"n": "Psytrance", "one": "Psicodélico, rápido y envolvente, nacido en las fiestas hippies de Goa, India.", "feel": "Un bajo rodante «pum-chiqui-pum-chiqui» + efectos que giran y se retuercen, como entrar en otro mundo.", "like": "Vini Vici «The Tribe», Infected Mushroom", "when": "Crystal Garden todo el sábado"}, "hardstyle": {"n": "Hardstyle", "one": "El sonido duro de Países Bajos y Bélgica; el bombo hace «BOOOM» distorsionado. Impresionante.", "feel": "Bombos distorsionados enormes + melodías épicas; el público levanta el puño a la vez.", "like": "Las partes duras de DVLM, Sub Zero Project, Brennan Heart", "when": "FREEDOM el viernes por la noche, Mainstage el sábado, cierre de Crystal Garden el domingo"}, "dnb": {"n": "Drum & Bass", "one": "Breakbeats rápidos del Reino Unido. La batería va rápida pero el bajo va lento: puedes saltar o balancearte.", "feel": "Breakbeats a 174 BPM con bajos densos; muévete a medio tiempo o a toda velocidad.", "like": "Netsky «Come Alive», Pendulum, Chase & Status", "when": "Codex el domingo por la noche"}, "bass": {"n": "Bass / Dubstep", "one": "Música electrónica donde el bajo pesado es el protagonista: agresiva o muy cinematográfica.", "feel": "Bajos que rugen, se distorsionan y ondulan (wobble), a veces con orquesta o aires de banda sonora.", "like": "Skrillex, Apashe, Excision", "when": "Codex el domingo"}, "trap": {"n": "Trap", "one": "Ritmo de hip-hop + drops de EDM: hecho para saltar y mover la cabeza.", "feel": "Subgraves 808, hi-hats rápidos, gritos de hip-hop.", "like": "DJ Snake «Turn Down for What», Yellow Claw «Shotgun»", "when": "Cierre de FREEDOM el viernes, cierre de Codex el domingo"}, "disco": {"n": "Disco / Indie Dance", "one": "Disco retro, funk y electrónica indie: ambiente de fiesta con buen gusto.", "feel": "Bajos vivos, sintes vintage; se baila con alegría y sin esfuerzo.", "like": "Purple Disco Machine, Daft Punk", "when": "CORE el domingo por la noche"}, "hardhouse": {"n": "Hard House / Hard Trance", "one": "El resurgir del hard house/trance británico: rápido y divertido.", "feel": "Bombos rápidos, bajos que rebotan, melodías rave nostálgicas.", "like": "Hannah Laing, Funk Tribu", "when": "FREEDOM el sábado, CORE el viernes"}, "pop": {"n": "Pop EDM / Vocal", "one": "Con cantantes y estribillos: seguramente ya has oído algo.", "feel": "Como canciones pop, pero más bailables, con muchos momentos para cantar a coro.", "like": "Alan Walker «Faded», R3HAB, NERVO", "when": "Mainstage"}, "party": {"n": "Himnos de fiesta / a coro", "one": "Cualquier género, cualquier clásico. El único objetivo: que todo el mundo cante.", "feel": "Éxitos de los 80, 90 y 2000, pop y mashups de todos los estilos; lo primero es pasarlo bien.", "like": "La última hora de una boda (pero más loca)", "when": "Moosebar todo el día"}, "live": {"n": "Instrumentos en directo", "one": "No solo pinchan temas: alguien toca instrumentos de verdad en directo.", "feel": "Saxo, teclados, bajo y más, improvisando sobre ritmos electrónicos.", "like": "Quien disfruta del directo de una banda", "when": "Goldfish abriendo el Mainstage el viernes, Agents Of Time el domingo"}}, "dj": {"Goldfish": {"o": "Sudáfrica", "d": "Dúo sudafricano que toca saxo, teclados y contrabajo en directo mientras pincha, mezclando instrumentos de jazz con un deep house soleado. Abren el festival: perfecto para calentar por la tarde."}, "Rave Republic": {"o": "Singapur (miembros suizo y australiano)", "d": "Dúo con base en Singapur, considerado uno de los dúos de EDM más representativos de Asia, con varias entradas en el DJ Mag Top 100. Big room de alta energía, pop EDM y mezclas más duras."}, "Youna": {"o": "Bélgica", "d": "DJ belga habitual en los eventos de Tomorrowland, que se mueve entre el house y sonidos de baile más duros."}, "Henri PFR": {"o": "Bélgica", "d": "DJ belga de la casa y habitual del Mainstage de Tomorrowland. Progressive / future house melódico y fácil de disfrutar."}, "Lilly Palmer": {"o": "Nacida en Suiza, afincada en Alemania", "d": "DJ de techno que ha explotado en los últimos años: techno contundente de hora punta con melodías o ganchos vocales muy pegadizos, y muchos vídeos virales. Una puerta de entrada muy amable al techno."}, "John Newman": {"o": "Reino Unido", "d": "Cantante británico de «Love Me Again» y la voz de «Feel the Love» de Rudimental. Ahora hace sets de DJ mezclando sus éxitos con house: habrá mucho canto a coro."}, "Kevin de Vries": {"o": "Alemania", "d": "Uno de los artistas clave del sello Afterlife y referente del melodic techno: oscuro, épico y con mucho empuje. Si te gusta el aire cinematográfico de Anyma, no te lo pierdas. El domingo además hace B2B con Morten."}, "HALŌ": {"o": "Rusia / Países Bajos / Reino Unido", "d": "Supergrupo formado en 2025: Matisse & Sadko (hermanos rusos) + DubVision (hermanos neerlandeses) + Third Party (dúo británico), con un progressive house emotivo y eufórico. Si te gusta el Garrix más melódico, te va a encantar."}, "Vini Vici": {"o": "Israel", "d": "El dúo que llevó el psytrance a los main stages de todo el mundo, conocido por «The Tribe» y «Great Spirit» con Armin van Buuren. Psicodélico, envolvente y tribal."}, "Alan Walker": {"o": "Noruega", "d": "El de «Faded» y «Alone», famoso por su máscara y capucha. Melodías suaves y muchos momentos para cantar."}, "Martin Garrix": {"o": "Países Bajos", "d": "Saltó a la fama con «Animals» y ha sido número 1 de DJ Mag varias veces. Cierra el viernes, así que habrá fuegos artificiales casi seguro."}, "Flosstradamus": {"o": "EE. UU.", "d": "Uno de los pioneros del trap EDM y figura clave para llevar el trap al EDM mainstream en los 2010. Un B2B con Yellow Claw va a reventar."}, "Yellow Claw": {"o": "Países Bajos", "d": "Dúo de Ámsterdam que mezcla trap, bass y hip-hop, conocido por «Shotgun». B2B con Flosstradamus el viernes y cierre de Codex el domingo."}, "Da Tweekaz": {"o": "Noruega", "d": "Dúo de hardstyle «feliz» que suele convertir canciones pop y clásicos de la infancia en hardstyle. La forma menos intimidante de probar el hardstyle por primera vez."}, "MANDY": {"o": "Bélgica", "d": "DJ belga de hardstyle del sello Dirty Workz, con muchos remixes duros de éxitos pop (incluido el remix oficial más duro de «Jackie Chan» de Tiësto & Post Malone)."}, "Bassjackers": {"o": "Países Bajos", "d": "Uno de los nombres neerlandeses del big room / electro y cara conocida del Mainstage de Tomorrowland: bombos potentes y energía directa."}, "Honey Gee": {"d": "Ha tocado en el escenario presentado por Yves V en Tomorrowland Bélgica (EDM / big room)."}, "Raiden": {"o": "Corea del Sur", "d": "DJ/productor coreano que ha trabajado con muchos artistas de K-pop (por ejemplo «Yours» con Chanyeol de EXO). EDM / future bass de corte pop."}, "Kryder": {"o": "Reino Unido", "d": "Veterano DJ británico de house y presentador del programa de radio Kryteria. Empezó en el progressive y ahora pincha house / tech house con mucho groove."}, "Funk Tribu": {"o": "De Colombia, afincado en Berlín", "d": "Famoso por «Phonky Tribu» y cara del actual «groovy trance»: aire retrofuturista de los 90–2000 con un ritmo que rebota. Cierra CORE el viernes."}, "X CLUB.": {"o": "Australia (afincados en Reino Unido)", "d": "Dúo australiano que parte del techno de los 90 y le mete breakbeat, jungle y trance: un «techno divertido» que nunca se siente frío."}, "Pegassi": {"o": "Bélgica", "d": "Proyecto del productor belga Sam Huybrecht, que mezcla eurodance, trance, techno y house: nostálgico y contundente."}, "Hyalyte": {"d": "Ha tocado en el escenario CORE de Tomorrowland Winter."}, "Ferry Corsten": {"o": "Países Bajos", "d": "Leyenda del trance, conocido por clásicos como System F «Out of the Blue» y Gouryella. Cierra Crystal Garden a medianoche el viernes, tras un B2B con Marsh."}, "Marsh": {"o": "Reino Unido", "d": "Productor de la familia Anjunadeep / Anjunabeats: progressive / deep house delicado y melódico, ideal para el atardecer."}, "Aly & Fila": {"o": "Egipto", "d": "Dúo egipcio de trance detrás de «Future Sound of Egypt», que ha tocado frente a las Pirámides. Uplifting trance que te eleva; leyendas para los fans del trance."}, "Cosmic Gate": {"o": "Alemania", "d": "Dúo alemán de trance activo desde 1999, conocido por «Exploration of Space». Trance potente y con toque tech."}, "Eli & Fur": {"o": "Reino Unido", "d": "Dúo británico femenino: voces soñadoras + deep / melodic house, suave pero con groove."}, "Yotto": {"o": "Finlandia", "d": "Productor finlandés salido de Anjunadeep, referente del melodic house / progressive con melodías limpias y preciosas."}, "CamelPhat": {"o": "Liverpool, Reino Unido", "d": "El dúo nominado al Grammy por «Cola», referentes del tech house y del sonido de club melódico. Ambiente de club al máximo."}, "Solardo": {"o": "Mánchester, Reino Unido", "d": "Dúo británico de tech house que dirige el sello Sola: bajos que rebotan y ritmos contundentes, hechos para bailar."}, "Linska": {"o": "Reino Unido", "d": "DJ en plena subida que pincha house / tech house alegre y contundente."}, "Lennert Wolfs": {"d": "Ha tocado en Tomorrowland Winter."}, "Jelle DK": {"o": "Bélgica", "d": "DJ residente del Moosebar. El Moosebar es el bar con temática de cabaña de caza canadiense de Tomorrowland, con himnos de fiesta de todos los géneros para cantar a coro y pasarlo bien."}, "Jan V": {"o": "Bélgica", "d": "Residente del Moosebar, toca los tres días. ¿Cansado, con ganas de una copa, éxitos nostálgicos y cantar con todos? Ve al Moosebar."}, "Jerrooo": {"o": "Bélgica", "d": "Residente del Moosebar que también toca en el Moose Bar de Tomorrowland Bélgica. Himnos de fiesta y mashups de todos los estilos."}, "Ian Asher": {"o": "EE. UU.", "d": "DJ/productor estadounidense de house / future house alegre y fácil de disfrutar."}, "Miss Monique": {"o": "Ucrania", "d": "DJ ucraniana que se hizo famosa con su serie de YouTube «Mind Space». Progressive / melodic techno precioso y con pegada: una gran introducción al melodic techno."}, "NERVO": {"o": "Australia", "d": "Hermanas gemelas australianas y compositoras (coautoras de «When Love Takes Over» de David Guetta). EDM pop y festivo."}, "Sub Zero Project": {"o": "Países Bajos", "d": "Dúo neerlandés de hardstyle, favoritos de Defqon.1, conocidos por «The Project». Duro pero con melodías épicas: la mejor introducción al hardstyle en el Mainstage."}, "ARTBAT": {"o": "Ucrania", "d": "Estrellas del melodic techno, conocidos por «Upperground»: épico, profundo y cinematográfico. En el Mainstage el sábado y B2B con R3HAB el domingo."}, "Afrojack": {"o": "Países Bajos", "d": "Productor de «Take Over Control» y de «Give Me Everything» de Pitbull, un icono del electro / big room."}, "Dimitri Vegas & Like Mike": {"o": "Bélgica (hermanos de origen griego)", "d": "Conocidos como los «reyes de Tomorrowland» y ex número 1 de DJ Mag. Big room, hardstyle y pop todo mezclado en un show exagerado."}, "Steve Aoki": {"o": "EE. UU.", "d": "Fundador de Dim Mak, famoso por lanzar tartas desde el escenario. Mezcla EDM, rock y hip-hop; cierra el sábado."}, "Nakadia": {"o": "Tailandia (afincada en Berlín)", "d": "DJ tailande morrowland Bélgica."}, "22 Bullets": {"o": "Bélgica", "d": "DJ belga de big room / EDM con energía directa, estilo Mainstage."}, "DubVision": {"o": "La Haya, Países Bajos", "d": "Hermanos neerlandeses de progressive house y miembros del supergrupo HALŌ."}, "Yves V": {"o": "Bélgica", "d": "Veterano de Tomorrowland y primer DJ belga en tocar en su Mainstage. Energía de fiesta Tomorrowland clásica."}, "Third Party": {"o": "Londres, Reino Unido", "d": "Dúo británico de progressive house muy melódico y miembros de HALŌ."}, "DVBBS": {"o": "Canadá", "d": "Hermanos canadienses conocidos por «Tsunami»; cierran Codex el sábado."}, "Halo": {"d": "Ojo: se escribe distinto que el HALŌ del viernes (sin macrón), así que puede no ser el mismo artista. También hay un conocido productor chino de house llamado Halo, pero no podemos confirmar de quién se trata."}, "Mattn": {"o": "Bélgica", "d": "DJ/productor belga de big room / EDM, habitual en los eventos de Tomorrowland."}, "Kölsch": {"o": "Dinamarca", "d": "Productor danés conocido por un melodic techno / house cálido, nostálgico y épico. Un sonido «bonito» poco habitual en el Mainstage: muy recomendado."}, "R3HAB": {"o": "Países Bajos", "d": "Prolífico productor de pop EDM que ha remezclado infinidad de éxitos pop. En el Mainstage el domingo y luego un B2B poco común con ARTBAT."}, "Alok": {"o": "Brasil", "d": "El DJ nacional de Brasil, conocido por «Hear Me Now» y cara del Brazilian bass; ahora también pincha un house más cálido."}, "Lost Frequencies": {"o": "Bélgica", "d": "«Are You With Me», «Where Are You Now»: tropical / deep house suave con muchos momentos para cantar."}, "Swedish House Mafia": {"o": "Suecia", "d": "«Don't You Worry Child», «One», «Save the World»: el legendario trío que cierra el festival."}, "Agents Of Time": {"o": "Italia", "d": "Trío italiano conocido por interpretar melodic techno en directo (no solo pinchar), de la familia Afterlife."}, "Morten": {"o": "Dinamarca", "d": "DJ danés que lanzó el proyecto «     for(const c of ['ja','ko','es','en'])if(l.startsWith(c))return c;}return 'en';}

/* ============ TIME (Bangkok) ============ */
function bkkNow(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const date=`${p.year}-${p.month}-${p.day}`;const min=(+p.hour)*60+(+p.minute);
  let fdate=date,fmin=min;
  if(+p.hour<9){const dt=new Date(Date.UTC(+p.year,+p.month-1,+p.day-1));fdate=dt.toISOString().slice(0,10);fmin=min+1440;}
  const day=DAYS.find(d=>d.iso===fdate);
  return {date,min,clock:`${p.hour}:${p.minute}`,day:day?day.id:null,fmin,live:!!day&&fmin>=START-60&&fmin<=dayEnd(day.id)+30};
}
function setStatus(s,now){if(!now.day)return now.date<DAYS[0].iso?'future':'past';
  const di=DAYS.findIndex(d=>d.id===s.day),ni=DAYS.findIndex(d=>d.id===now.day);
  if(di<ni)return 'past';if(di>ni)return 'future';
  if(now.fmin>=s.end)return 'past';if(now.fmin>=s.start)return 'now';return 'future';}

function renderGrid(){
  const day=curDay,end=dayEnd(day),H=(end-START)*1.5,now=bkkNow();
  let h=`<div class="gh corner"></div>`+STAGES.map(s=>`<div class="gh">${s.name}${s.sub?'<br><span style="font-weight:400;opacity:.6">'+s.sub+'</span>':''}<i style="background:${s.c}"></i></div>`).join('');
  let t='';for(let m=START;m<=end;m+=30){const y=(m-START)*1.5;t+=`<div class="tlab" style="top:${y}px;${y===0?'transform:translateY(3px)':''}">${m%60?'':fmt(m)}</div>`;}
  h+=`<div class="tcol" style="height:${H+20}px">${t}</div>`;
  let lines='';for(let m=START;m<=end;m+=30)lines+=`<div class="hline ${m%60?'half':''}" style="top:${(m-START)*1.5}px"></div>`;
  for(const s of STAGES){
    let col=`<div class="scol" style="height:${H+20}px">${lines}`;
    for(const set of SETS.filter(x=>x.day===day&&x.stage===s.id)){
      const top=(set.start-START)*1.5+1,ht=(set.end-set.start)*1.5-3;
      const st=setStatus(set,now),f=favs.has(set.id),p=partner.has(set.id);
      const g=setGenres(set).slice(0,2).map(k=>gName(k).split(' /')[0]).join(' · ');
      const dim=gridFilter&&!setGenres(set).includes(gridFilter);
      col+=`<button class="set ${f?'fav':''} ${st==='past'?'past':''} ${st==='now'?'now':''} ${dim?'dim':''}" style="top:${top}px;height:${ht}px;--sc:${s.c}" data-set="${set.id}">
        ${(f||p)?`<span class="hearts">${f?'♥':''}${p?'<span style="color:var(--pink)">♥</span>':''}</span>`:''}
        <span class="n">${esc(set.name)}</span><span class="t">${fmt(set.start)}–${fmt(set.end)}</span>${ht>62?`<span class="g">${esc(g)}</span>`:''}</button>`;
    }
    h+=col+'</div>';
  }
  if(now.day===day&&now.fmin>=START&&now.fmin<=end)h+=`<div class="nowline" style="top:${44+(now.fmin-START)*1.5}px"></div>`;
  $('#grid').innerHTML=h;
}

function renderNow(){const now=bkkNow(),day=curDay,end=dayEnd(day);
  const liveToday=now.day===day&&now.fmin>=START&&now.fmin<end;
  const t=simTime!=null?simTime:(liveToday?now.fmin:20*60);
  let head;
  if(liveToday&&simTime==null)head=`<div class="bigtime">${now.clock}</div><div class="small muted">${esc(T('now_live',{d:dayShort(day)}))}</div>`;
  else{let msg='';if(now.date<DAYS[0].iso){const n=Math.ceil((Date.parse(DAYS[0].iso+'T13:00:00+07:00')-Date.now())/86400000);msg=' '+T('countdown',{n});}
    head=`<div class="bigtime">${fmt(t)}</div><div class="small muted">${esc(T('now_drag',{d:dayShort(day)})+msg)}</div>`;}
  let h=`<div style="margin-top:8px">${head}</div>
    <input type="range" id="slider" min="${START}" max="${end-15}" step="15" value="${Math.min(Math.max(t,START),end-15)}" style="margin-top:10px">
    <div class="row small muted" style="justify-content:space-between"><span>13:00</span>${liveToday?`<button class="chip" id="toNow">${esc(T('back_now'))}</button>`:''}<span>${fmt(end)}</span></div>`;
  const myNext=SETS.filter(s=>s.day===day&&favs.has(s.id)&&s.end>t).sort((a,b)=>a.start-b.start)[0];
  if(myNext){const live=myNext.start<=t;h+=`<div class="sec">${esc(T('my_next'))}</div><button class="card" style="width:100%;text-align:left;border-color:var(--gold)" data-set="${myNext.id}">
     <div class="row"><span class="stagebar" style="background:${stageById[myNext.stage].c}"></span><div style="flex:1"><div class="nm">♥ ${esc(myNext.name)}</div>
     <div class="small muted">${stageById[myNext.stage].name} · ${fmt(myNext.start)}–${fmt(myNext.end)} · ${live?`<b style="color:var(--live)">${esc(T('in_progress'))}</b>`:esc(T('in_min',{n:myNext.start-t}))}</div></div></div></button>`;}
  h+=`<div class="sec">${esc(T('stages'))}</div>`;
  for(const s of STAGES){const sets=SETS.filter(x=>x.day===day&&x.stage===s.id);
    const cur=sets.find(x=>x.start<=t&&t<x.end),nxt=sets.find(x=>x.start>t);
    h+=`<div class="card"><div class="row"><span class="stagebar" style="background:${s.c}"></span><div style="flex:1;min-width:0"><div class="tiny" style="color:${s.c};font-weight:700;letter-spacing:.08em">${s.name}</div>`;
    if(cur){const pct=Math.round((t-cur.start)/(cur.end-cur.start)*100);
      h+=`<button style="text-align:left;width:100%;margin-top:4px" data-set="${cur.id}"><div class="row" style="gap:6px"><span class="pill">NOW</span><span class="nm" style="flex:1">${favs.has(cur.id)?'♥ ':''}${esc(cur.name)}</span></div>
        <div class="small muted" style="margin-top:3px">${fmt(cur.start)}–${fmt(cur.end)} · ${esc(setGenres(cur).map(gName).slice(0,2).join(' · '))}</div><div class="prog"><i style="width:${pct}%"></i></div></button>`;}
    else h+=`<div class="small muted" style="margin-top:4px">${esc(nxt?T('not_started'):T('ended'))}</div>`;
    if(nxt)h+=`<button style="text-align:left;width:100%;margin-top:8px" data-set="${nxt.id}"><div class="row" style="gap:6px"><span class="pill next">NEXT ${fmt(nxt.start)}</span><span class="small" style="flex:1">${favs.has(nxt.id)?'♥ ':''}${esc(nxt.name)}</span></div></button>`;
    h+='</div></div></div>';}
  h+=`<div class="note">${esc(T('tz_note'))}</div>`;
  $('#nowPane').innerHTML=h;
  $('#slider').oninput=e=>{simTime=+e.target.value;renderNow();};
  const tn=$('#toNow');if(tn)tn.onclick=()=>{simTime=null;renderNow();};
}
$('#nowPane').addEventListener('click',e=>{const s=e.target.closest('[data-set]');if(s)openSet(s.dataset.set);});

/* ============ MINE ============ */
function encodeFavs(set){return 'TMLTH:'+[...set].map(id=>{const s=SETBYID[id];return DAYS.findIndex(d=>d.id===s.day)+''+STAGES.findIndex(x=>x.id===s.stage)+id.split('.')[2];}).join('-');}
function decodeFavs(str){const m=String(str).match(/TMLTH:([0-9\-]+)/);if(!m)return null;const out=new Set();
  for(const c of m[1].split('-')){if(c.length<3)continue;const d=DAYS[+c[0]],s=STAGES[+c[1]];if(!d||!s)continue;const id=d.id+'.'+s.id+'.'+c.slice(2);if(SETBYID[id])out.add(id);}return out;}
function renderMine(){
  let h='';
  if(!favs.size&&!partner.size)h+=`<div class="empty">${T('mine_empty')}</div>`;
  for(const d of DAYS){
    const ids=new Set([...favs,...partner].filter(id=>SETBYID[id].day===d.id));if(!ids.size)continue;
    const list=[...ids].map(id=>SETBYID[id]).sort((a,b)=>a.start-b.start||a.end-b.end);
    h+=`<div class="sec">${d.label} · ${esc(dayLine(d.id))}</div>`;
    for(const s of list){const st=stageById[s.stage],mine=favs.has(s.id),hers=partner.has(s.id),ov=mine?overlapsFor(s,favs):[];
      h+=`<button class="card" style="width:100%;text-align:left;${mine&&hers?'border-color:var(--gold)':''}" data-set="${s.id}"><div class="row">
        <span class="stagebar" style="background:${st.c}"></span><div style="flex:1;min-width:0">
        <div class="row" style="justify-content:space-between"><span class="small muted" style="font-variant-numeric:tabular-nums">${fmt(s.start)}–${fmt(s.end)}</span>
        <span class="small">${mine?`<span style="color:var(--gold)">♥ ${esc(T('me'))}</span>`:''} ${hers?`<span style="color:var(--pink)">♥ ${esc(pName())}</span>`:''}</span></div>
        <div class="nm">${esc(s.name)}</div><div class="tiny" style="color:${st.c}">${st.name}</div>
        ${mine&&hers?`<div class="small ok" style="margin-top:3px">${esc(T('both_want'))}</div>`:''}
        ${ov.length?`<div class="warn">${esc(T('overlap_with',{x:ov.map(o=>`${o.name} (${fmt(Math.max(o.start,s.start))}–${fmt(Math.min(o.end,s.end))})`).join(', ')}))}</div>`:''}
        </div></div></button>`;}
  }
  h+=`<div class="sec">${esc(T('sync_title'))}</div><div class="card">
    <div class="small" style="line-height:1.6">${esc(T('sync_desc'))}</div>
    <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn sm primary" id="copyMine">${esc(T('copy_mine'))}</button>
    <span class="small muted">${esc(T('partner_name'))}</span><input type="text" id="pname" value="${esc(partnerName)}" placeholder="${esc(T('partner_default'))}" style="width:110px;padding:6px 10px;font-size:13px"></div>
    <textarea id="importBox" placeholder="${esc(T('import_ph'))}" style="margin-top:10px"></textarea>
    <div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap"><button class="btn sm gold" id="doImport">${esc(T('do_import'))}</button>
    ${partner.size?`<button class="btn sm" id="clrPartner">${esc(T('clr_partner'))}</button>`:''}${favs.size?`<button class="btn sm" id="clrMine">${esc(T('clr_mine'))}</button>`:''}</div></div>
    <div class="note">${esc(T('local_note'))}</div>`;
  $('#minePane').innerHTML=h;
  $('#copyMine').onclick=async()=>{if(!favs.size){toast(T('t_none'));return;}const code=encodeFavs(favs);
    try{await navigator.clipboard.writeText(code);toast(T('t_copied'));}catch(e){const b=$('#importBox');b.value=code;b.select();toast(T('t_copy_manual'));}};
  $('#pname').onchange=e=>{partnerName=e.target.value.trim();store.set('partnerName',partnerName);renderMine();renderGrid();};
  $('#doImport').onclick=()=>{const s=decodeFavs($('#importBox').value);if(!s||!s.size){toast(T('t_bad_code'));return;}
    partner=s;saveFavs();toast(T('t_imported',{n:s.size}));renderMine();renderGrid();};
  const cp=$('#clrPartner');if(cp)cp.onclick=()=>{if(confirmLite(cp)){partner.clear();saveFavs();renderMine();renderGrid();}};
  const cm=$('#clrMine');if(cm)cm.onclick=()=>{if(confirmLite(cm)){favs.clear();saveFavs();renderMine();renderGrid();}};
}
function confirmLite(btn){if(btn.dataset.armed)return true;btn.dataset.armed=1;const t=btn.textContent;btn.textContent=T('confirm_again');setTimeout(()=>{btn.textContent=t;delete btn.dataset.armed;},2500);return false;}
$('#minePane').addEventListener('click',e=>{const s=e.target.closest('[data-set]');if(s)openSet(s.dataset.set);});

/* ============ DJ GUIDE ============ */
function djRow(a){const dj=DJ[a],sets=(dj.sets||[]).map(id=>SETBYID[id]);
  const badge=dj.h?`<span class="pill big">${esc(T('pill_big_s'))}</span>`:dj.p?`<span class="pill pick">${esc(T('pill_pick_s'))}</span>`:'';
  const d=djText(a,'d'),o=djText(a,'o');const desc=dj.lim?(d||T('lim_short')):d;
  return `<button class="card" style="width:100%;text-align:left" data-dj="${esc(a)}">
   <div class="row" style="justify-content:space-between;align-items:flex-start"><div style="min-width:0"><div class="nm">${esc(a)}</div>${o?`<div class="tiny muted">${esc(o)}</div>`:''}</div>${badge}</div>
   <div style="margin-top:4px">${(dj.g||[]).map(k=>`<span class="tag" style="border-color:${META.genres[k].c}66">${esc(gName(k))}${dj.guess?'?':''}</span>`).join('')}</div>
   <div class="small" style="margin-top:6px;color:#cbd2e8;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(desc)}</div>
   <div class="tiny muted" style="margin-top:6px">${sets.map(s=>`${esc(dayShort(s.day))} ${fmt(s.start)} · ${stageById[s.stage].name}`).join('　')}</div></button>`;}
function renderDJs(){
  const filters=[['all',T('f_all')],['pick',T('f_pick')],['big',T('f_big')],['today',T('f_today',{d:dayShort(curDay)})],['lim',T('f_lim')]];
  let h=`<input type="search" id="djq" placeholder="${esc(T('dj_search_ph'))}" value="${esc(djQuery)}" style="margin-top:6px">
   <div class="hscroll" style="margin-top:8px">${filters.map(([k,n])=>`<span class="chip ${djFilter===k?'on':''}" data-djf="${k}">${esc(n)}</span>`).join('')}
   ${GENRE_KEYS.map(k=>`<span class="chip ${djFilter==='g:'+k?'on':''}" data-djf="g:${k}">${esc(gName(k))}</span>`).join('')}</div>`;
  if(djFilter==='pick')h+=`<div class="note" style="margin-top:8px">${esc(T('pick_note'))}</div>`;
  const q=djQuery.trim().toLowerCase();
  const names=Object.keys(DJ).filter(a=>{const d=DJ[a];if(!d.sets)return false;
    if(djFilter==='pick'&&!d.p)return false;if(djFilter==='big'&&!d.h)return false;if(djFilter==='lim'&&!d.lim)return false;
    if(djFilter==='today'&&!d.sets.some(id=>SETBYID[id].day===curDay))return false;
    if(djFilter.startsWith('g:')&&!(d.g||[]).includes(djFilter.slice(2)))return false;
    if(q){const hay=(a+' '+djText(a,'o')+' '+djText(a,'d')+' '+(d.g||[]).map(gName).join(' ')).toLowerCase();if(!hay.includes(q))return false;}
    return true;});
  const rank=a=>DJ[a].h?0:DJ[a].p?1:DJ[a].lim?3:2;
  names.sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
  h+=`<div class="small muted" style="margin:10px 0 6px">${esc(T('n_artists',{n:names.length}))}</div>`+names.map(djRow).join('');
  if(!names.length)h+=`<div class="empty">${esc(T('no_match'))}</div>`;
  $('#djPane').innerHTML=h;
  $('#djq').oninput=e=>{djQuery=e.target.value;const pos=e.target.selectionStart;renderDJs();const n=$('#djq');n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}};
}
$('#djPane').addEventListener('click',e=>{const f=e.target.closest('[data-djf]');if(f){djFilter=f.dataset.djf;renderDJs();return;}
  const d=e.target.closest('[data-dj]');if(d)openDJ(d.dataset.dj);});

/* ============ GENRES ============ */
function genreBody(k){return `<p>${esc(gText(k,'one'))}</p><div class="kv"><b>${esc(T('k_feel'))}</b>${esc(gText(k,'feel'))}</div>
  <div class="kv"><b>${esc(T('k_bpm'))}</b>${esc(T('k_bpm_v',{b:META.genres[k].bpm}))}</div><div class="kv"><b>${esc(T('k_like'))}</b>${esc(gText(k,'like'))}</div><div class="kv"><b>${esc(T('k_when'))}</b>${esc(gText(k,'when'))}</div>`;}
function renderGenres(){
  const routes=L().ui.routes.map((lab,i)=>`${lab} ${ROUTES[i].map(a=>`<a data-dj="${esc(a)}" class="tag click">${esc(a)}</a>`).join('')}`).join('<br>');
  let h=`<div class="note" style="margin-top:6px">${esc(T('genre_intro'))}</div>
  <div class="card" style="margin-top:12px"><div class="small" style="line-height:1.85"><b style="color:var(--cream)">${esc(T('routes_title'))}</b><br>${routes}</div></div>`;
  for(const k of GENRE_KEYS){const n=Object.keys(DJ).filter(a=>DJ[a].sets&&(DJ[a].g||[]).includes(k)&&!DJ[a].guess).length;
    h+=`<button class="card glo" style="width:100%;text-align:left;border-left:4px solid ${META.genres[k].c}" data-genre="${k}"><h3>${esc(gName(k))}</h3>${genreBody(k)}
      <div class="small" style="margin-top:6px;color:var(--gold)">${esc(T('see_artists',{n}))}</div></button>`;}
  h+=`<div class="note">${esc(T('bpm_note'))}</div>`;
  $('#genrePane').innerHTML=h;
}
$('#genrePane').addEventListener('click',e=>{const d=e.target.closest('[data-dj]');if(d){e.stopPropagation();openDJ(d.dataset.dj);return;}
  const g=e.target.closest('[data-genre]');if(g)openGenre(g.dataset.genre);});


/* ============ ABOUT / INSTALL ============ */
const UA=navigator.userAgent||'';
const isIOS=/iPhone|iPad|iPod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=/Android/i.test(UA);
const isInApp=/Line\/|FBAN|FBAV|Instagram|MicroMessenger|KAKAOTALK|Twitter|WhatsApp|TikTok|musical_ly|BytedanceWebview/i.test(UA);
const isStandalone=()=>{try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
let aboutTab=isAndroid?'android':'ios';
function openAbout(){
  const steps=L().ui[aboutTab+'_steps']||I18N.en.ui[aboutTab+'_steps'];
  let h=`<h2>${esc(T('about_title'))}</h2><div class="sec" style="margin-top:14px">${esc(T('install_title'))}</div>`;
  if(isStandalone())h+=`<div class="okbox">${esc(T('installed_ok'))}</div>`;
  else{
    if(isInApp)h+=`<div class="warnbox">${esc(T('inapp_warn'))}</div>`;
    h+=`<div class="tabs"><span class="chip ${aboutTab==='ios'?'on':''}" data-atab="ios">${esc(T('tab_ios'))}</span><span class="chip ${aboutTab==='android'?'on':''}" data-atab="android">${esc(T('tab_android'))}</span></div>
      <ol class="steps">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  }
  h+=`<p class="small" style="line-height:1.7;color:#d6dcef;margin-top:14px">${esc(T('storage_note'))}</p>
    <p class="small" style="line-height:1.7;color:#d6dcef">${esc(T('update_note'))}</p>
    <div class="disc">${esc(T('unofficial'))}<br>${esc(T('tz_note'))}<br><span style="opacity:.8">tmlth-guide.github.io</span></div>`;
  openSheet(h);
}
$('#infoBtn').addEventListener('click',openAbout);
function bannerHTML(){if(isStandalone()||store.get('bannerOff',false))return '';
  return `<div id="banner"><span class="bt">${esc(T('banner'))}</span><button class="chip on" data-banner="open">${esc(T('banner_btn'))}</button><button class="bx" data-banner="close" aria-label="${esc(T('close'))}">×</button></div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-banner]');if(b){if(b.dataset.banner==='open')openAbout();else{store.set('bannerOff',true);gridHeaderExtras();}return;}
  const t=e.target.closest('[data-atab]');if(t){aboutTab=t.dataset.atab;openAbout();}});

/* ============ NAV ============ */
function setView(v){curView=v;store.set('view',v);
  document.querySelectorAll('.view').forEach(el=>el.classList.toggle('on',el.id==='v-'+v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  renderCurrent();}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v);});
function renderCurrent(){if(curView==='grid'){renderGrid();gridHeaderExtras();}else if(curView==='now')renderNow();else if(curView==='mine')renderMine();else if(curView==='djs')renderDJs();else renderGenres();}
function renderAll(){renderDays();renderCurrent();if(curView==='grid')scrollGridToNow();}

(function init(){const n=bkkNow();if(!curDay||!DAYS.some(d=>d.id===curDay))curDay='fri';if(n.day)curDay=n.day;
  applyStatic();updateBadge();setView(curView);renderDays();if(curView==='grid')scrollGridToNow();
  setInterval(()=>{tick();const n2=bkkNow();if(n2.live&&curView==='grid')renderGrid();else if(n2.live&&curView==='now'&&simTime==null)renderNow();},60000);
  window.addEventListener('resize',()=>{if(curView==='grid')gridHeaderExtras();});
  try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
})();
</script>
</body>
</html>
