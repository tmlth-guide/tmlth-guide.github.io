<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TML TH">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Tomorrowland Thailand 2026 行程表</title>
<style>
:root{
  --bg:#0a1430; --bg2:#111e45; --bg3:#18295a; --line:#24376e;
  --cream:#f5e6c6; --cream2:#ead7ae; --gold:#e0b65e; --ink:#15203f;
  --text:#e9edf7; --muted:#8f9cc0; --pink:#ff7aa8; --live:#ff5a5a;
  --px:1.5px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% 0%,#1a2c66 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* header */
header{padding:calc(10px + var(--safe-t)) 14px 8px;flex:none}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{margin:0;font-size:16px;letter-spacing:.14em;font-weight:600;color:var(--cream)}
.brand small{color:var(--gold);letter-spacing:.3em;font-size:10px}
.brand .clock{margin-left:auto;font-size:11px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;margin-top:10px}
.days button{flex:1;padding:8px 0;border-radius:12px;background:var(--bg2);border:1px solid var(--line);
  color:var(--muted);font-size:13px;line-height:1.15}
.days button b{display:block;font-size:15px;color:var(--text);font-weight:600}
.days button.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.days button.on b{color:var(--ink)}
.days button .livedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-left:4px;vertical-align:middle}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;display:none}
.view.on{display:block}
.pad{padding:4px 14px calc(90px + var(--safe-b))}

.langbtn{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--cream);background:var(--bg2)}
.langbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.langlist button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:14px 12px;border-radius:12px;font-size:16px;border:1px solid var(--line);margin-bottom:8px;background:var(--bg3)}
.langlist button.on{background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:700}
@media (max-width:430px){.brand small{display:none}}
.infobtn{padding:4px 6px}
#banner{margin:0 14px 8px;padding:9px 10px 9px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(224,182,94,.18),rgba(224,182,94,.06));border:1px solid rgba(224,182,94,.45);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--cream);line-height:1.4}
#banner .bt{flex:1}
#banner .bx{font-size:18px;line-height:1;color:var(--muted);padding:2px 4px}
.tabs{display:flex;gap:6px;margin:10px 0}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.8;color:#d6dcef}
.okbox{background:rgba(120,210,150,.12);border:1px solid rgba(120,210,150,.4);color:#bdf0cc;border-radius:10px;padding:10px 12px;font-size:13.5px}
.warnbox{background:rgba(255,120,120,.1);border:1px solid rgba(255,120,120,.4);color:#ffd0d0;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:8px}
.disc{font-size:12.5px;line-height:1.7;color:var(--muted);border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
/* bottom nav */
nav{flex:none;display:flex;background:rgba(10,20,48,.96);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + var(--safe-b));backdrop-filter:blur(10px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--cream)}
nav .badge{position:absolute;margin-left:18px;margin-top:-2px;background:var(--gold);color:var(--ink);font-size:9px;border-radius:8px;padding:0 4px;font-weight:700}

/* grid */
.gridtools{display:flex;gap:6px;align-items:center;padding:0 14px 8px;font-size:12px;color:var(--muted);flex-wrap:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--bg2);
  border:1px solid var(--line);font-size:12px;color:var(--text);white-space:nowrap}
.chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.vibe{padding:0 14px 8px;font-size:12px;color:var(--muted);line-height:1.5}
.vibe b{color:var(--cream);font-weight:600}
#gridScroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.grid{position:relative;display:grid;grid-template-columns:42px repeat(7,108px);width:max-content;padding-bottom:calc(90px + var(--safe-b))}
.gh{position:sticky;top:0;z-index:5;background:rgba(10,20,48,.97);height:44px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--cream);border-bottom:1px solid var(--line);padding:0 4px;line-height:1.15}
.gh.corner{left:0;z-index:7}
.gh i{display:block;width:22px;height:3px;border-radius:2px;margin:3px auto 0}
.tcol{position:sticky;left:0;z-index:4;background:rgba(10,20,48,.95);border-right:1px solid var(--line)}
.tlab{position:absolute;right:5px;font-size:10px;color:var(--muted);transform:translateY(-6px);font-variant-numeric:tabular-nums}
.scol{position:relative;border-right:1px solid rgba(36,55,110,.5)}
.hline{position:absolute;left:0;right:0;height:1px;background:rgba(36,55,110,.45)}
.hline.half{background:rgba(36,55,110,.2)}
.set{position:absolute;left:3px;right:3px;border-radius:8px;background:var(--cream);color:var(--ink);padding:5px 6px 4px 8px;
  overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:1px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.set::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc,#999)}
.set .n{font-weight:700;font-size:12px;line-height:1.18;word-break:break-word}
.set .t{font-size:10px;opacity:.65;font-variant-numeric:tabular-nums}
.set .g{font-size:9.5px;opacity:.7;line-height:1.2}
.set.fav{background:var(--gold);box-shadow:0 0 0 2px var(--cream) inset}
.set .hearts{position:absolute;right:4px;top:3px;font-size:11px;line-height:1}
.set.past{opacity:.38}
.set.now{box-shadow:0 0 0 2px var(--live),0 0 14px rgba(255,90,90,.55)}
.set.dim{opacity:.18}
.nowline{position:absolute;left:42px;right:0;height:2px;background:var(--live);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--live)}

/* lists/cards */
.sec{margin:14px 0 8px;font-size:13px;color:var(--gold);letter-spacing:.08em;font-weight:600}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
.stagebar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.nm{font-weight:700;font-size:15px}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;margin:2px 3px 0 0;border:1px solid var(--line);color:var(--cream2);background:rgba(255,255,255,.03)}
.tag.click{cursor:pointer}
.pill{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--live);color:#fff;letter-spacing:.05em}
.pill.next{background:var(--bg3);color:var(--cream)}
.pill.pick{background:var(--gold);color:var(--ink)}
.pill.big{background:#5b6fd6;color:#fff}
.prog{height:3px;background:var(--bg3);border-radius:2px;margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--live)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--bg3);
  border:1px solid var(--line);font-size:14px;color:var(--text)}
.btn.primary{background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:700}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.warn{color:#ffb4b4;font-size:12px;margin-top:4px}
.ok{color:#a9e4b8}
input[type=search],input[type=text],textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:10px 12px;font-size:15px;outline:none}
textarea{min-height:64px;font-size:13px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--gold)}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;line-height:1.7}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:16px}
.bigtime{font-size:30px;font-weight:700;color:var(--cream);font-variant-numeric:tabular-nums}

/* sheet */
#back{position:fixed;inset:0;background:rgba(3,8,22,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#back.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86vh;overflow:auto;background:var(--bg2);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:8px 16px calc(24px + var(--safe-b));
  transform:translateY(105%);transition:transform .25s ease}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
#sheet h2{margin:0 0 2px;font-size:21px;color:var(--cream)}
.djblock{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.djblock h3{margin:0;font-size:17px}
.djblock p{margin:8px 0;font-size:14px;line-height:1.65;color:#d6dcef}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.links a{color:var(--gold);font-size:12.5px;text-decoration:none;border:1px solid var(--line);padding:6px 10px;border-radius:10px}
.limited{font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px;line-height:1.6}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);background:var(--cream);color:var(--ink);
  padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.glo h3{margin:0 0 4px;font-size:16px;color:var(--cream)}
.glo p{margin:6px 0;font-size:13.5px;line-height:1.65;color:#d6dcef}
.glo .kv{font-size:12px;color:var(--muted);margin-top:4px}
.glo .kv b{color:var(--cream2);font-weight:600}
@media (min-width:900px){ .grid{grid-template-columns:52px repeat(7,minmax(130px,1fr));width:100%} .pad{max-width:760px;margin:0 auto} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>TOMORROWLAND</h1><small>THAILAND</small><span class="clock" id="clock"></span><button class="langbtn infobtn" id="infoBtn" aria-label="About"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button><button class="langbtn" id="langBtn" aria-label="Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><span id="langLbl"></span></button></div>
    <div class="days" id="days"></div>
  </header>
  <main>
    <section class="view" id="v-grid">
      <div id="gridScroll"><div class="grid" id="grid"></div></div>
    </section>
    <section class="view" id="v-now"><div class="pad" id="nowPane"></div></section>
    <section class="view" id="v-mine"><div class="pad" id="minePane"></div></section>
    <section class="view" id="v-djs"><div class="pad" id="djPane"></div></section>
    <section class="view" id="v-genre"><div class="pad" id="genrePane"></div></section>
  </main>
  <nav id="nav">
    <button data-v="grid" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 4v17M13 4v17"/></svg><span data-i18n="nav_grid">行程表</span></button>
    <button data-v="now"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="nav_now">此刻</span></button>
    <button data-v="mine"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span data-i18n="nav_mine">我的</span><span class="badge" id="favBadge" hidden></span></button>
    <button data-v="djs"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-i18n="nav_djs">DJ 圖鑑</span></button>
    <button data-v="genre"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span data-i18n="nav_genre">曲風</span></button>
  </nav>
</div>
<div id="back"></div>
<div id="sheet"></div>
<div class="toast" id="toast"></div>

<script>

 "英國來的高速碎拍，鼓很快但貝斯很慢，可以跳也可以搖。", "feel": "鼓是 174 BPM 的碎拍，貝斯線厚重；可以用半速搖擺，也可以全速跳。", "like": "Netsky〈Come Alive〉、Pendulum、Chase & Status", "when": "週日 Codex 晚上"}, "bass": {"n": "Bass / Dubstep", "one": "以「超重低音」為主角的電音，很兇或很有畫面感。", "feel": "低音會咆哮、扭曲、搖晃（wobble），有時配上管弦樂或電影感配樂。", "like": "Skrillex、Apashe、Excision", "when": "週日 Codex"}, "trap": {"n": "Trap", "one": "嘻哈節奏 + EDM 爆點，很適合跳躍與甩頭。", "feel": "808 重低音、快速的 hi-hat、嘻哈人聲口號。", "like": "DJ Snake〈Turn Down for What〉、Yellow Claw〈Shotgun〉", "when": "週五 FREEDOM 壓軸、週日 Codex 壓軸"}, "disco": {"n": "Disco / Indie Dance", "one": "復古迪斯可、放克與獨立電子，派對感但很有品味。", "feel": "活潑的貝斯、復古合成器、跳舞跳得很開心不吃力。", "like": "Purple Disco Machine、Daft Punk", "when": "CORE 週日晚上"}, "hardhouse": {"n": "Hard House / Hard Trance", "one": "英國復興中的硬派 house/trance，又快又開心。", "feel": "快速的大鼓、跳動的貝斯、懷舊 rave 旋律。", "like": "Hannah Laing、Funk Tribu", "when": "週六 FREEDOM、週五 CORE"}, "pop": {"n": "流行電音 / 人聲", "one": "有歌手、有副歌，聽過的機率很高。", "feel": "像流行歌但更適合跳舞，很多大合唱時刻。", "like": "Alan Walker〈Faded〉、R3HAB、Nervo", "when": "主舞台"}, "party": {"n": "派對金曲 / 大合唱", "one": "不分曲風，什麼經典放什麼，目的是讓全場唱。", "feel": "80/90/00 年代金曲、流行歌、跨曲風混搭，歡樂度第一。", "like": "婚禮/尾牙的最後一小時（但更瘋）", "when": "Moosebar 全天"}, "live": {"n": "樂器現場", "one": "不只放音樂，現場會有人演奏真的樂器。", "feel": "薩克斯風、鍵盤、貝斯等即興演奏疊在電子節奏上。", "like": "喜歡現場樂團感的人", "when": "週五主舞台開場 Goldfish、週日 Agents Of Time"}}, "dj": {"Goldfish": {"o": "南非", "d": "南非雙人組，現場會邊放邊吹薩克斯風、彈鍵盤和低音提琴，把爵士樂器融進陽光感的 deep house。開幕第一組，非常適合下午進場暖身。"}, "Rave Republic": {"o": "新加坡（瑞士 + 澳洲成員）", "d": "以新加坡為基地的雙人組，被稱為亞洲最具代表性的 EDM 雙人組之一，曾多次進入 DJ Mag Top 100。風格是高能量的 big room、流行電音和偏硬的混搭。"}, "Youna": {"o": "比利時", "d": "比利時女 DJ，Tomorrowland 體系常見的名字，風格游走在 house 與偏硬的舞曲之間。"}, "Henri PFR": {"o": "比利時", "d": "比利時本土培養的 DJ，Tomorrowland 主舞台常客。作品旋律感強、好入口，偏 progressive / future house。"}, "Lilly Palmer": {"o": "瑞士出生、德國發展", "d": "近年爆紅的女 techno DJ，招牌是強勁的 peak-time techno 加上很洗腦的旋律或人聲 hook，社群上很多短片。想入門 techno 的話她很友善。"}, "John Newman": {"o": "英國", "d": "英國歌手，代表作〈Love Me Again〉，也是 Rudimental〈Feel the Love〉的人聲。近年轉做 DJ set，會把自己的熱門歌和 house 混在一起，很多大合唱。"}, "Kevin de Vries": {"o": "德國", "d": "Afterlife 廠牌的核心人物之一，melodic techno 代表。黑暗、壯闊、推進感很強。如果你喜歡 Anyma 那種電影感，一定要聽。週日還和 Morten B2B。"}, "HALŌ": {"o": "俄羅斯 / 荷蘭 / 英國", "d": "2025 年成立的超級組合：Matisse & Sadko（俄羅斯兄弟）＋ DubVision（荷蘭兄弟）＋ Third Party（英國雙人）三組合體，主打很感動、很 euphoric 的 progressive house。喜歡 Garrix 旋律派的話會很愛。"}, "Vini Vici": {"o": "以色列", "d": "把 psytrance 帶上全球主舞台的雙人組，代表作〈The Tribe〉、與 Armin van Buuren 合作的〈Great Spirit〉。迷幻、旋轉、很有部落感。"}, "Alan Walker": {"o": "挪威", "d": "〈Faded〉〈Alone〉的那位，招牌是口罩與兜帽。旋律溫柔、很多大合唱。"}, "Martin Garrix": {"o": "荷蘭", "d": "〈Animals〉成名，多次奪下 DJ Mag 世界第一。週五壓軸，煙火預定。"}, "Flosstradamus": {"o": "美國", "d": "美國 trap 電音先驅之一，2010 年代把 trap 帶進 EDM 主流的關鍵人物。和 Yellow Claw B2B 會非常炸。"}, "Yellow Claw": {"o": "荷蘭", "d": "阿姆斯特丹雙人組，trap、bass、嘻哈跨界，代表作〈Shotgun〉。週五和 Flosstradamus B2B，週日 Codex 壓軸。"}, "Da Tweekaz": {"o": "挪威", "d": "「歡樂派」hardstyle 雙人組，很常把流行歌、童年金曲改成 hardstyle。想第一次體驗 hardstyle，從他們開始最不會怕。"}, "MANDY": {"o": "比利時", "d": "比利時女 hardstyle DJ，簽約 Dirty Workz 廠牌，做過很多流行歌的 hard remix（例如 Tiësto & Post Malone〈Jackie Chan〉的官方 harder remix）。"}, "Bassjackers": {"o": "荷蘭", "d": "荷蘭 big room / electro 代表之一，Tomorrowland 主舞台老面孔，重拍、能量直衝。"}, "Honey Gee": {"d": "曾出現在 Tomorrowland 比利時 Yves V 主持的舞台（偏 EDM / big room）。"}, "Raiden": {"o": "韓國", "d": "韓國 DJ / 製作人，和許多 K-pop 歌手合作過（例如與 EXO 燦烈的〈Yours〉），風格是流行感強的 EDM / future bass。"}, "Kryder": {"o": "英國", "d": "英國資深 house DJ，主持廣播節目 Kryteria。從 progressive 起家，現在偏律動強的 house / tech house。"}, "Funk Tribu": {"o": "哥倫比亞出身、柏林發展", "d": "以〈Phonky Tribu〉成名，代表近年很紅的「groovy trance」：90–00 年代的復古未來感 + 很彈的節奏。週五 CORE 壓軸。"}, "X CLUB.": {"o": "澳洲（定居英國）", "d": "澳洲雙人組，從 90 年代 techno 出發，混入 breakbeat、jungle 與 trance，整體是「好玩的 techno」，不會太冷。"}, "Pegassi": {"o": "比利時", "d": "比利時製作人 Sam Huybrecht 的計畫，把 eurodance、trance、techno、house 混在一起，懷舊又帶勁。"}, "Hyalyte": {"d": "曾在 Tomorrowland Winter 的 CORE 舞台演出。"}, "Ferry Corsten": {"o": "荷蘭", "d": "Trance 傳奇之一，以 System F〈Out of the Blue〉、Gouryella 等經典聞名。週五午夜收尾 Crystal Garden，前面還有和 Marsh 的 B2B。"}, "Marsh": {"o": "英國", "d": "Anjunadeep / Anjunabeats 體系的製作人，旋律細膩的 progressive / deep house，適合日落時段。"}, "Aly & Fila": {"o": "埃及", "d": "埃及 trance 雙人組，主持「Future Sound of Egypt」，曾在金字塔前演出。主打高昂的 uplifting trance，是 trance 迷心中的神。"}, "Cosmic Gate": {"o": "德國", "d": "1999 年成軍的德國 trance 雙人組，經典〈Exploration of Space〉。比較有力、偏 tech 的 trance。"}, "Eli & Fur": {"o": "英國", "d": "英國女雙人組，夢幻人聲 + deep / melodic house，溫柔又有律動。"}, "Yotto": {"o": "芬蘭", "d": "芬蘭製作人，Anjunadeep 出身，melodic house / progressive 的代表，旋律很乾淨漂亮。"}, "CamelPhat": {"o": "英國利物浦", "d": "〈Cola〉獲葛萊美提名的雙人組，tech house 與旋律系的代表，夜店氛圍滿點。"}, "Solardo": {"o": "英國曼徹斯特", "d": "英國 tech house 雙人組，經營 Sola 廠牌，貝斯彈、節奏猛，很適合跳。"}, "Linska": {"o": "英國", "d": "近年竄紅的女 DJ，風格是輕快帶勁的 house / tech house。"}, "Lennert Wolfs": {"d": "曾在 Tomorrowland Winter 演出。"}, "Jelle DK": {"o": "比利時", "d": "Moosebar 駐場 DJ。Moosebar 是 Tomorrowland 的加拿大狩獵小屋主題酒吧，放的是跨曲風派對金曲，主打大合唱與歡樂。"}, "Jan V": {"o": "比利時", "d": "Moosebar 駐場 DJ，三天都有。累了想喝一杯、聽懷舊金曲、和大家一起唱，就往 Moosebar 走。"}, "Jerrooo": {"o": "比利時", "d": "Moosebar 駐場 DJ，Tomorrowland 比利時也固定在 Moose Bar 出現。派對金曲、跨曲風混搭。"}, "Ian Asher": {"o": "美國", "d": "美國 DJ / 製作人，風格是輕快好入口的 house / future house。"}, "Miss Monique": {"o": "烏克蘭", "d": "烏克蘭女 DJ，以 YouTube 上的「Mind Space」系列走紅，progressive / melodic techno，漂亮又帶勁，非常適合入門旋律派 techno。"}, "NERVO": {"o": "澳洲", "d": "澳洲雙胞胎姊妹，也是作曲人（參與寫了 David Guetta〈When Love Takes Over〉）。流行感 EDM、氣氛派。"}, "Sub Zero Project": {"o": "荷蘭", "d": "荷蘭 hardstyle 雙人組，Defqon.1 的代表人物，經典〈The Project〉。會很硬，但旋律很史詩，主舞台上的 hardstyle 入門首選。"}, "ARTBAT": {"o": "烏克蘭", "d": "melodic techno 天團，代表作〈Upperground〉。壯闊、深沉、有電影感。週六主舞台，週日還和 R3HAB B2B。"}, "Afrojack": {"o": "荷蘭", "d": "〈Take Over Control〉、Pitbull〈Give Me Everything〉的製作人，electro / big room 代表。"}, "Dimitri Vegas & Like Mike": {"o": "比利時（希臘裔兄弟）", "d": "被稱為「Tomorrowland 之王」，曾登 DJ Mag 世界第一。big room、hardstyle、流行歌全都混，現場超級浮誇。"}, "Steve Aoki": {"o": "美國", "d": "Dim Mak 廠牌老闆，招牌是在台上丟蛋糕。電音、搖滾、嘻哈跨界，週六壓軸。"}, "Nakadia": {"o": "泰國（柏林發展）", "d": "在柏林發展的泰國女 techno DJ，國際 techno 圈少數的泰國代表，這次算是回家演出，現場應該會很有感情。"}, "Amber Broos": {"o": "比利時", "d": "比利時年輕女 techno DJ，Tomorrowland 常客，風格是充滿能量的 peak-time techno。"}, "Space 92": {"o": "法國", "d": "法國 techno 製作人，聲音大氣、工業感重、很有爆發力。"}, "Hannah Laing": {"o": "英國蘇格蘭", "d": "英國 hard house / hard trance 復興的代表女 DJ，開心又快，體力準備好。"}, "Nico Moreno": {"o": "法國", "d": "法國 hard techno 代表，速度快、聲音兇，是現在最熱門的硬派 techno 之一。"}, "Luuk van Dijk": {"o": "荷蘭", "d": "荷蘭 DJ，house / tech house 帶點迪斯可與復古元素，很有律動。"}, "DJ Boring": {"o": "澳洲出生、倫敦發展", "d": "以 lo-fi house 名曲〈Winona〉走紅，近年的 set 變得更快更 rave，但保留懷舊溫度。"}, "Mind Against": {"o": "義大利", "d": "義大利兄弟檔，Afterlife 體系的 melodic techno 代表，深邃、黑暗、很有氛圍。週六 CORE 壓軸。"}, "Firaga": {"d": "曾在 Tomorrowland 比利時的 psytrance 舞台（Planaxis）演出。"}, "Ghost Rider": {"o": "以色列", "d": "以色列 psytrance 製作人，偏 progressive / full-on 的迷幻風格。"}, "Blastoyz": {"o": "以色列", "d": "以色列 psytrance 製作人，旋律感強、主流化的 psytrance，很多人從他入坑。"}, "Vegas": {"d": "psytrance DJ，曾進入 DJ Mag Top 100，也在 Tomorrowland 多個版本演出。"}, "Infected Mushroom": {"o": "以色列", "d": "1996 年成軍的 psytrance 傳奇雙人組，經典〈Becoming Insane〉。又迷幻又搖滾，週六 Crystal Garden 壓軸。"}, "Manuals": {"d": "曾在 Tomorrowland 比利時與 Tomorrowland Winter 演出。"}, "Nome.": {"d": "曾在 Tomorrowland 比利時演出。"}, "22 Bullets": {"o": "比利時", "d": "比利時 big room / EDM DJ，能量直接，主舞台風格。"}, "DubVision": {"o": "荷蘭海牙", "d": "荷蘭兄弟檔，progressive house，也是超級組合 HALŌ 的成員之一。"}, "Yves V": {"o": "比利時", "d": "Tomorrowland 元老，第一位登上主舞台的比利時 DJ，經典 Tomorrowland 狂歡風格。"}, "Third Party": {"o": "英國倫敦", "d": "英國雙人組，旋律感十足的 progressive house，也是 HALŌ 的成員。"}, "DVBBS": {"o": "加拿大", "d": "加拿大兄弟檔，代表作〈Tsunami〉，週六 Codex 壓軸。"}, "Halo": {"d": "注意：這和週五的 HALŌ 拼法不同（沒有長音符號），不一定是同一組。中國也有一位知名 house 製作人叫 Halo，但無法確認是哪位。"}, "Mattn": {"o": "比利時", "d": "比利時 DJ / 製作人，big room / EDM，Tomorrowland 體系常見。"}, "Kölsch": {"o": "丹麥", "d": "丹麥製作人，招牌是溫暖、懷舊又壯闊的旋律 techno / house。主舞台少見的「美」路線，強烈推薦。"}, "R3HAB": {"o": "荷蘭", "d": "流行電音大量產製作人，remix 過無數流行歌。週日主舞台，之後還和 ARTBAT B2B（很難得的組合）。"}, "Alok": {"o": "巴西", "d": "巴西國民 DJ，〈Hear Me Now〉，Brazilian bass 代表，近年也走更溫暖的 house。"}, "Lost Frequencies": {"o": "比利時", "d": "〈Are You With Me〉〈Where Are You Now〉，溫柔的 tropical / deep house，大合唱時刻很多。"}, "Swedish House Mafia": {"o": "瑞典", "d": "〈Don't You Worry Child〉〈One〉〈Save the World〉，三人傳奇組合，閉幕大秀。"}, "Agents Of Time": {"o": "義大利", "d": "義大利三人組，以「現場演奏」的 melodic techno 聞名（不是只放音樂），Afterlife 系。"}, "Morten": {"o": "丹麥", "d": "丹麥 DJ，和 David Guetta 一起推出「Future Rave」計畫。跟 Kevin de Vries 的 B2B 會是大舞台 × 黑暗 techno 的碰撞。"}, "Dino Lenny": {"o": "義大利", "d": "義大利資深 house DJ / 製作人，優雅的旋律 house。"}, "Maxi Meraki": {"o": "比利時", "d": "比利時製作人，afro / melodic house，溫暖有律動，近年很紅。"}, "Améme": {"d": "afro house 代表 DJ / 製作人之一，鼓組豐富、很有身體感。"}, "Honeyluv": {"o": "美國", "d": "美國女 DJ，tech house，律動感強、很好跳。"}, "DJ Tennis": {"o": "義大利", "d": "Life and Death 廠牌主理人，indie dance / 電子，帶點憂鬱的派對音樂，品味派。"}, "Joris Voorn": {"o": "荷蘭", "d": "荷蘭 techno / house 名家，經典〈Ringo〉，混音細膩，DJ 中的 DJ。"}, "Krystal Klear": {"o": "愛爾蘭", "d": "愛爾蘭 DJ，disco / house，代表作〈Neutron Dance〉，超開心的律動。"}, "Angemi": {"d": "big room / EDM DJ，曾登 Tomorrowland 主舞台。"}, "Whisnu Santika": {"o": "印尼", "d": "印尼最知名的 EDM DJ 之一，會把印尼 funkot 等在地元素放進 big room，東南亞主場氣氛會很好。"}, "Matisse & Sadko": {"o": "俄羅斯", "d": "俄羅斯兄弟檔，與 Martin Garrix 合作多首作品（〈Together〉〈Forever〉等），HALŌ 成員。"}, "Lucas & Steve": {"o": "荷蘭", "d": "荷蘭雙人組，Spinnin' Records 出身，輕快的 future house，好入口。"}, "Laidback Luke": {"o": "荷蘭", "d": "資深 electro house DJ（荷蘭菲律賓裔），Mixmash 廠牌主理人，混音技巧很強。"}, "Quintino": {"o": "荷蘭", "d": "荷蘭 big room DJ，重拍、直接、適合狂跳。"}, "Brennan Heart": {"o": "荷蘭", "d": "Hardstyle 傳奇，被稱為「Hardstyle 總統」之一。週日 Crystal Garden 收尾，史詩旋律 + 硬核大鼓。"}, "Sabai": {"o": "美國", "d": "美國製作人，melodic bass / future bass，溫柔又有重量。"}, "Andromedik": {"o": "比利時", "d": "比利時 drum & bass 製作人，Liquicity 體系，旋律派、很好入坑的 DnB。"}, "Apashe": {"o": "比利時出生、加拿大發展", "d": "把交響樂和重低音 bass 結合，電影感十足，代表作〈No Twerk〉。"}, "Netsky": {"o": "比利時", "d": "比利時 drum & bass 代表人物，〈Come Alive〉，旋律好聽、律動強，DnB 入門首選。"}, "Neon": {"d": "曾在 Tomorrowland Winter 演出。"}, "To Be Discovered": {"d": "官方行程表上就寫「To Be Discovered」，可能是神秘嘉賓或尚未公布的演出，現場再看。"}, "AdamK": {"o": "加拿大", "d": "加拿大資深 progressive house DJ（Adam K），旋律溫暖、律動穩定。"}}, "vibe": {"f t_ph": "把对方传来的 TMLTH:… 贴在这里", "do_import": "导入对方清单", "clr_partner": "清除对方清单", "clr_mine": "清除我的", "confirm_again": "再按一次确认", "local_note": "选择只存在这支手机的浏览器里。清除浏览器数据会一并清掉。", "partner_default": "她", "dj_search_ph": "搜索 DJ 名称、国家、曲风…", "f_all": "全部", "f_pick": "⭐ 推荐探索", "f_big": "主流大咖", "f_today": "{d}出场", "f_lim": "数据少的新面孔", "pick_note": "“推荐探索”是给只熟主流 DJ 的人：这些不一定最大牌，但在各自的曲风里很有代表性，好入门又值得现场听。", "n_artists": "{n} 组艺人", "no_match": "找不到符合的 DJ", "lim_short": "公开数据较少 · 挖宝候选", "genre_intro": "只认识主流 DJ 很正常。主舞台多半是 Big Room / EDM，但其他舞台各有各的“宗教”。先看你喜欢的主流歌属于哪一类，再去找同类型的新名字。", "routes_title": "从主流出发的探索路线", "routes": ["喜欢 <b>Martin Garrix / Swedish House Mafia</b> 的旋律 →", "喜欢 <b>Anyma / 黑暗壮阔感</b> →", "喜欢 <b>DVLM 的硬段落</b> →", "喜欢 <b>Vini Vici</b> → 周六整天的 Crystal Garden，压轴是", "喜欢 <b>Lost Frequencies 的温柔</b> →", "喜欢 <b>〈Cola〉这种夜店律动</b> →", "想试 <b>完全没听过的</b>（DnB、交响 bass、泰国 techno）→"], "k_feel": "听起来像：", "k_bpm": "速度：", "k_bpm_v": "约 {b} BPM", "k_like": "如果你喜欢：", "k_when": "这次去哪听：", "see_artists": "查看这次的 {n} 组艺人 →", "bpm_note": "BPM ＝ 每分钟拍数，数字越大越快。一般流行歌约 100–120。", "lang_title": "语言 / Language", "about_title": "关于与安装", "unofficial": "这是粉丝制作的非官方时间表，与 Tomorrowland 官方无关。时段根据官方公布的图片整理（主舞台时间为估读），实际以官方 App 和现场公告为准。", "install_title": "添加到主屏幕，没网也能用", "installed_ok": "✓ 已从主屏幕打开，可以离线使用。", "tab_ios": "iPhone", "tab_android": "Android", "ios_steps": ["用 <b>Safari</b> 打开这个网址", "点底部的“分享”按钮（方框加向上箭头）；<b>如果没看到，先点“•••”再点“分享”</b>", "往下滑，点“<b>添加到主屏幕</b>”→“添加”", "从主屏幕的新图标打开一次，数据就会保存到手机"], "android_steps": ["用 <b>Chrome</b> 打开这个网址", "点右上角的“⋮”", "点“<b>添加到主屏幕</b>”或“<b>安装应用</b>”", "从主屏幕的新图标打开一次，数据就会保存到手机"], "inapp_warn": "⚠︎ 你现在是在 App 内置的浏览器里（例如微信、LINE、Instagram），无法添加到主屏幕。请点右上角菜单，选择“在浏览器中打开”，改用 Safari 或 Chrome 打开。", "storage_note": "“我的行程”只保存在你这部手机里，不会上传。iPhone 上 Safari 标签页和主屏幕图标的数据是分开的，添加到主屏幕后请都从图标打开。", "update_note": "网页有更新时，在有网络的地方打开一次就会自动更新。建议出发前在酒店有 Wi-Fi 时再打开一次。", "banner": "非官方粉丝制作 · 添加到主屏幕即可离线使用", "banner_btn": "教程", "close": "关闭"}, "content": {"genres": {"bigroom": {"n": "Big Room / EDM", "one": "主舞台最常听到的那种：大爆点、全场一起跳、烟火时刻。", "feel": "先铺陈 → 拉高 → 停一拍 → 重低音炸开（drop）。旋律好记，常混流行歌。", "like": "Martin Garrix〈Animals〉、Dimitri Vegas & Like Mike、Afrojack", "when": "主舞台晚上、Crystal Garden 周日"}, "prog": {"n": "Progressive House", "one": "比 Big Room 更“旋律、温暖、感动”，适合大合唱与日落。", "feel": "钢琴和弦、渐强的合成器、情绪堆栈；不那么吵，但很澎湃。", "like": "Swedish House Mafia〈Don't You Worry Child〉、Garrix〈Forever〉、Avicii", "when": "周五 HALŌ、周六 Codex 晚上"}, "house": {"n": "House", "one": "电子舞曲的“本家”，四拍稳稳踩着，让人一直摇。", "feel": "稳定的 动-次-动-次，常有灵魂乐/迪斯可人声采样。不靠爆点，靠律动。", "like": "Lost Frequencies、Kryder、Fisher", "when": "Papillon 整天、Codex 周五"}, "techhouse": {"n": "Tech House", "one": "House 的律动 + Techno 的低沉，贝斯线很“弹”，夜店感。", "feel": "贝斯一直在动、打击乐很密、人声常是一两句重复的口号。", "like": "CamelPhat〈Cola〉、Fisher〈Losing It〉、John Summit", "when": "周五 Codex 晚上（Solardo、CamelPhat）"}, "melhouse": {"n": "Melodic / Deep House", "one": "柔和、带点忧郁或梦幻的 House，耳朵很舒服。", "feel": "温暖的和弦、空灵人声、不急不徐。适合下午或休息时听。", "like": "Lost Frequencies 较 chill 的作品、Bob Moses、Yotto", "when": "Crystal Garden 周五傍晚、Papillon 周日"}, "afro": {"n": "Afro House", "one": "非洲打击乐 + House，很有部落感与身体律动。", "feel": "鼓组丰富、节奏层次多、常有非洲语系的吟唱。", "like": "Black Coffee、Keinemusik、〈Move〉Adam Port", "when": "CORE 周日（Maxi Meraki、Améme）"}, "meltechno": {"n": "Melodic Techno", "one": "近年最红的“黑暗但美丽”电音，壮阔、催眠、电影感。", "feel": "低沉推进的鼓、缓慢开展的大旋律，没有大爆点，但会让你整个人陷进去。", "like": "Anyma、ARTBAT〈Upperground〉、Afterlife 厂牌", "when": "周五主舞台 Kevin de Vries、周日 FREEDOM"}, "techno": {"n": "Techno", "one": "重复、催眠、工业感，重点是律动与音色变化。", "feel": "很少人声、旋律极简，靠鼓与声响的细微变化让人一直跳下去。", "like": "Amelie Lens、Charlotte de Witte、Lilly Palmer", "when": "周六 FREEDOM（Atmosphere）"}, "hardtechno": {"n": "Hard Techno", "one": "更快、更硬、更凶的 Techno，现在年轻人最爱的地下派对声音。", "feel": "很硬的大鼓、常有 90 年代 rave 或 trance 旋律片段，体力消耗大。", "like": "Nico Moreno、Indira Paganotto", "when": "周六 FREEDOM 收尾"}, "trance": {"n": "Trance", "one": "90–00 年代的欧洲经典，“心被拉高”的感觉。", "feel": "长长的铺陈、高亢的旋律、很大的空间感与情绪释放（uplifting）。", "like": "Armin van Buuren、Tiësto 早期、Above & Beyond", "when": "Crystal Garden 周五整晚"}, "psy": {"n": "Psytrance", "one": "迷幻、快速、旋转感，源自印度果亚的嬉皮派对。", "feel": "“咚叽咚叽”滚动的贝斯 + 扭曲旋转的音效，像进入另一个世界。", "like": "Vini Vici〈The Tribe〉、Infected Mushroom", "when": "Crystal Garden 周六整天"}, "hardstyle": {"n": "Hardstyle", "one": "荷兰/比利时的硬派电音，大鼓会“咚——”地扭曲，很震撼。", "feel": "超重的失真大鼓 + 史诗级旋律，现场大家会跟着挥拳。", "like": "DVLM 的硬段、Sub Zero Project、Brennan Heart", "when": "周五 FREEDOM 晚上、周六主舞台、周日 Crystal 压轴"}, "dnb": {"n": "Drum & Bass", "one": "英国来的高速碎拍，鼓很快但贝斯很慢，可以跳也可以摇。", "feel": "鼓是 174 BPM 的碎拍，贝斯线厚重；可以用半速摇摆，也可以全速跳。", "like": "Netsky〈Come Alive〉、Pendulum、Chase & Status", "when": "周日 Codex 晚上"}, "bass": {"n": "Bass / Dubstep", "one": "以“超重低音”为主角的电音，很凶或很有画面感。", "feel": "低音会咆哮、扭曲、摇晃（wobble），有时配上管弦乐或电影感配乐。", "like": "Skrillex、Apashe、Excision", "when": "周日 Codex"}, "trap": {"n": "Trap", "one": "嘻哈节奏 + EDM 爆点，很适合跳跃与甩头。", "feel": "808 重低音、快速的 hi-hat、嘻哈人声口号。", "like": "DJ Snake〈Turn Down for What〉、Yellow Claw〈Shotgun〉", "when": "周五 FREEDOM 压轴、周日 Codex 压轴"}, "disco": {"n": "Disco / Indie Dance", "one": "复古迪斯可、放克与独立电子，派对感但很有品味。", "feel": "活泼的贝斯、复古合成器、跳舞跳得很开心不吃力。", "like": "Purple Disco Machine、Daft Punk", "when": "CORE 周日晚上"}, "hardhouse": {"n": "Hard House / Hard Trance", "one": "英国复兴中的硬派 house/trance，又快又开心。", "feel": "快速的大鼓、跳动的贝斯、怀旧 rave 旋律。", "like": "Hannah Laing、Funk Tribu", "when": "周六 FREEDOM、周五 CORE"}, "pop": {"n": "流行电音 / 人声", "one": "有歌手、有副歌，听过的几率很高。", "feel": "像流行歌但更适合跳舞，很多大合唱时刻。", "like": "Alan Walker〈Faded〉、R3HAB、Nervo", "when": "主舞台"}, "party": {"n": "派对金曲 / 大合唱", "one": "不分曲风，什么经典放什么，目的是让全场唱。", "feel": "80/90/00 年代金曲、流行歌、跨曲风混搭，欢乐度第一。", "like": "婚礼/尾牙的最后一小时（但更疯）", "when": "Moosebar 全天"}, "live": {"n": "乐器现场", "one": "不只放音乐，现场会有人演奏真的乐器。", "feel": "萨克斯风、键盘、贝斯等即兴演奏叠在电子节奏上。", "like": "喜欢现场乐团感的人", "when": "周五主舞台开场 Goldfish、周日 Agents Of Time"}}, "dj": {"Goldfish": {"o": "南非", "d": "南非双人组，现场会边放边吹萨克斯风、弹键盘和低音提琴，把爵士乐器融进阳光感的 deep house。开幕第一组，非常适合下午进场暖身。"}, "Rave Republic": {"o": "新加坡（瑞士 + 澳洲成员）", "d": "以新加坡为基地的双人组，被称为亚洲最具代表性的 EDM 双人组之一，曾多次进入 DJ Mag Top 100。风格是高能量的 big room、流行电音和偏硬的混搭。"}, "Youna": {"o": "比利时", "d": "比利时女 DJ，Tomorrowland 体系常见的名字，风格游走在 house 与偏硬的舞曲之间。"}, "Henri PFR": {"o": "比利时", "d": "比利时本土培养的 DJ，Tomorrowland 主舞台常客。作品旋律感强、好入口，偏 progressive / future house。"}, "Lilly Palmer": {"o": "瑞士出生、德国发展", "d": "近年爆红的女 techno DJ，招牌是强劲的 peak-time techno 加上很洗脑的旋律或人声 hook，社群上很多短片。想入门 techno 的话她很友善。"}, "John Newman": {"o": "英国", "d": "英国歌手，代表作〈Love Me Again〉，也是 Rudimental〈Feel the Love〉的人声。近年转做 DJ set，会把自己的热门歌和 house 混在一起，很多大合唱。"}, "Kevin de Vries": {"o": "德国", "d": "Afterlife 厂牌的内核人物之一，melodic techno 代表。黑暗、壮阔、推进感很强。如果你喜欢 Anyma 那种电影感，一定要听。周日还和 Morten B2B。"}, "HALŌ": {"o": "俄罗斯 / 荷兰 / 英国", "d": "2025 年成立的超级组合：Matisse & Sadko（俄罗斯兄弟）＋ DubVision（荷兰兄弟）＋ Third Party（英国双人）三组合体，主打很感动、很 euphoric 的 progressive house。喜欢 Garrix 旋律派的话会很爱。"}, "Vini Vici": {"o": "以色列", "d": "把 psytrance 带上全球主舞台的双人组，代表作〈The Tribe〉、与 Armin van Buuren 合作的〈Great Spirit〉。迷幻、旋转、很有部落感。"}, "Alan Walker": {"o": "挪威", "d": "〈Faded〉〈Alone〉的那位，招牌是口罩与兜帽。旋律温柔、很多大合唱。"}, "Martin Garrix": {"o": "荷兰", "d": "〈Animals〉成名，多次夺下 DJ Mag 世界第一。周五压轴，烟火预定。"}, "Flosstradamus": {"o": "美国", "d": "美国 trap 电音先驱之一，2010 年代把 trap 带进 EDM 主流的关键人物。和 Yellow Claw B2B 会非常炸。"}, "Yellow Claw": {"o": "荷兰", "d": "阿姆斯特丹双人组，trap、bass、嘻哈跨界，代表作〈Shotgun〉。周五和 Flosstradamus B2B，周日 Codex 压轴。"}, "Da Tweekaz": {"o": "挪威", "d": "“欢乐派”hardstyle 双人组，很常把流行歌、童年金曲改成 hardstyle。想第一次体验 hardstyle，从他们开始最不会怕。"}, "MANDY": {"o": "比利时", "d": "比利时女 hardstyle DJ，签约 Dirty Workz 厂牌，做过很多流行歌的 hard remix（例如 Tiësto & Post Malone〈Jackie Chan〉的官方 harder remix）。"}, "Bassjackers": {"o": "荷兰", "d": "荷兰 big room / electro 代表之一，Tomorrowland 主舞台老面孔，重拍、能量直冲。"}, "Honey Gee": {"d": "曾出现在 Tomorrowland 比利时 Yves V 主持的舞台（偏 EDM / big room）。"}, "Raiden": {"o": "韩国", "d": "韩国 DJ / 制作人，和许多 K-pop 歌手合作过（例如与 EXO 灿烈的〈Yours〉），风格是流行感强的 EDM / future bass。"}, "Kryder": {"o": "英国", "d": "英国资深 house DJ，主持广播节目 Kryteria。从 progressive 起家，现在偏律动强的 house / tech house。"}, "Funk Tribu": {"o": "哥伦比亚出身、柏林发展", "d": "以〈Phonky Tribu〉成名，代表近年很红的“groovy trance”：90–00 年代的复古未来感 + 很弹的节奏。周五 CORE 压轴。"}, "X CLUB.": {"o": "澳洲（定居英国）", "d": "澳洲双人组，从 90 年代 techno 出发，混入 breakbeat、jungle 与 trance，整体是“好玩的 techno”，不会太冷。"}, "Pegassi": {"o": "比利时", "d": "比利时制作人 Sam Huybrecht 的计划，把 eurodance、trance、techno、house 混在一起，怀旧又带劲。"}, "Hyalyte": {"d": "曾在 Tomorrowland Winter 的 CORE 舞台演出。"}, "Ferry Corsten": {"o": "荷兰", "d": "Trance 传奇之一，以 System F〈Out of the Blue〉、Gouryella 等经典闻名。周五午夜收尾 Crystal Garden，前面还有和 Marsh 的 B2B。"}, "Marsh": {"o": "英国", "d": "Anjunadeep / Anjunabeats 体系的制作人，旋律细腻的 progressive / deep house，适合日落时段。"}, "Aly & Fila": {"o": "埃及", "d": "埃及 trance 双人组，主持“Future Sound of Egypt”，曾在金字塔前演出。主打高昂的 uplifting trance，是 trance 迷心中的神。"}, "Cosmic Gate": {"o": "德国", "d": "1999 年成军的德国 trance 双人组，经典〈Exploration of Space〉。比较有力、偏 tech 的 trance。"}, "Eli & Fur": {"o": "英国", "d": "英国女双人组，梦幻人声 + deep / melodic house，温柔又有律动。"}, "Yotto": {"o": "芬兰", "d": "芬兰制作人，Anjunadeep 出身，melodic house / progressive 的代表，旋律很干净漂亮。"}, "CamelPhat": {"o": "英国利物浦", "d": "〈Cola〉获葛莱美提名的双人组，tech house 与旋律系的代表，夜店氛围满点。"}, "Solardo": {"o": "英国曼彻斯特", "d": "英国 tech house 双人组，经营 Sola 厂牌，贝斯弹、节奏猛，很适合跳。"}, "Linska": {"o": "英国", "d": "近年窜红的女 DJ，风格是轻快带劲的 house / tech house。"}, "Lennert Wolfs": {"d": "曾在 Tomorrowland Winter 演出。"}, "Jelle DK": {"o": "比利时", "d": "Moosebar 驻场 DJ。Moosebar 是 Tomorrowland 的加拿大狩猎小屋主题酒吧，放的是跨曲风派对金曲，主打大合唱与欢乐。"}, "Jan V": {"o": "比利时", "d": "Moosebar 驻场 DJ，三天都有。累了想喝一杯、听怀旧金曲、和大家一起唱，就往 Moosebar 走。"}, "Jerrooo": {"o": "比利时", "d": "Moosebar 驻场 DJ，Tomorrowland 比利时也固定在 Moose Bar 出现。派对金曲、跨曲风混搭。"}, "Ian Asher": {"o": "美国", "d": "美国 DJ / 制作人，风格是轻快好入口的 house / future house。"}, "Miss Monique": {"o": "乌克兰", "d": "乌克兰女 DJ，以 YouTube 上的“Mind Space”系列走红，progressive / melodic techno，漂亮又带劲，非常适合入门旋律派 techno。"}, "NERVO": {"o": "澳洲", "d": "澳洲双胞胎姊妹，也是作曲人（参与写了 David Guetta〈When Love Takes Over〉）。流行感 EDM、气氛派。"}, "Sub Zero Project": {"o": "荷兰", "d": "荷兰 hardstyle 双人组，Defqon.1 的代表人物，经典〈The Project〉。会很硬，但旋律很史诗，主舞台上的 hardstyle 入门首选。"}, "ARTBAT": {"o": "乌克兰", "d": "melodic techno 天团，代表作〈Upperground〉。壮阔、深沉、有电影感。周六主舞台，周日还和 R3HAB B2B。"}, "Afrojack": {"o": "荷兰", "d": "〈Take Over Control〉、Pitbull〈Give Me Everything〉的制作人，electro / big room 代表。"}, "Dimitri Vegas & Like Mike": {"o": "比利时（希腊裔兄弟）", "d": "被称为“Tomorrowland 之王”，曾登 DJ Mag 世界第一。big room、hardstyle、流行歌全都混，现场超级浮夸。"}, "Steve Aoki": {"o": "美国", "d": "Dim Mak 厂牌老板，招牌是在台上丢蛋糕。电音、摇滚、嘻哈跨界，周六压轴。"}, "Nakadia": {"o": "泰国（柏林发展）", "d": "在柏林发展的泰国女 techno DJ，国际 techno 圈少数的泰国代表，这次算是回家演出，现场应该会很有感情。"}, "Amber Broos": {"o": "比利时", "d": "比利时年轻女 techno DJ，Tomorrowland 常客，风格是充满能量的 peak-time techno。"}, "Space 92": {"o": "法国", "d": "法国 techno 制作人，声音大气、工业感重、很有爆发力。"}, "Hannah Laing": {"o": "英国苏格兰", "d": "英国 hard house / hard trance 复兴的代表女 DJ，开心又快，体力准备好。"}, "Nico Moreno": {"o": "法国", "d": "法国 hard techno 代表，速度快、声音凶，是现在最热门的硬派 techno 之一。"}, "Luuk van Dijk": {"o": "荷兰", "d": "荷兰 DJ，house / tech house 带点迪斯可与复古元素，很有律动。"}, "DJ Boring": {"o": "澳洲出生、伦敦发展", "d": "以 lo-fi house 名曲〈Winona〉走红，近年的 set 变得更快更 rave，但保留怀旧温度。"}, "Mind Against": {"o": "意大利", "d": "意大利兄弟档，Afterlife 体系的 melodic techno 代表，深邃、黑暗、很有氛围。周六 CORE 压轴。"}, "Firaga": {"d": "曾在 Tomorrowland 比利时的 psytrance 舞台（Planaxis）演出。"}, "Ghost Rider": {"o": "以色列", "d": "以色列 psytrance 制作人，偏 progressive / full-on 的迷幻风格。"}, "Blastoyz": {"o": "以色列", "d": "以色列 psytrance 制作人，旋律感强、主流化的 psytrance，很多人从他入坑。"}, "Vegas": {"d": "psytrance DJ，曾进入 DJ Mag Top 100，也在 Tomorrowland 多个版本演出。"}, "Infected Mushroom": {"o": "以色列", "d": "1996 年成军的 psytrance 传奇双人组，经典〈Becoming Insane〉。又迷幻又摇滚，周六 Crystal Garden 压轴。"}, "Manuals": {"d": "曾在 Tomorrowland 比利时与 Tomorrowland Winter 演出。"}, "Nome.": {"d": "曾在 Tomorrowland 比利时演出。"}, "22 Bullets": {"o": "比利时", "d": "比利时 big room / EDM DJ，能量直接，主舞台风格。"}, "DubVision": {"o": "荷兰海牙", "d": "荷兰兄弟档，progressive house，也是超级组合 HALŌ 的成员之一。"}, "Yves V": {"o": "比利时", "d": "Tomorrowland 元老，第一位登上主舞台的比利时 DJ，经典 Tomorrowland 狂欢风格。"}, "Third Party": {"o": "英国伦敦", "d": "英国双人组，旋律感十足的 progressive house，也是 HALŌ 的成员。"}, "DVBBS": {"o": "加拿大", "d": "加拿大兄弟档，代表作〈Tsunami〉，周六 Codex 压轴。"}, "Halo": {"d": "注意：这和周五的 HALŌ 拼法不同（没有长音符号），不一定是同一组。中国也有一位知名 house 制作人叫 Halo，但无法确认是哪位。"}, "Mattn": {"o": "比利时", "d": "比利时 DJ / 制作人，big room / EDM，Tomorrowland 体系常见。"}, "Kölsch": {"o": "丹麦", "d": "丹麦制作人，招牌是温暖、怀旧又壮阔的旋律 techno / house。主舞台少见的“美”路线，强烈推荐。"}, "R3HAB": {"o": "荷兰", "d": "流行电音大量产制作人，remix 过无数流行歌。周日主舞台，之后还和 ARTBAT B2B（很难得的组合）。"}, "Alok": {"o": "巴西", "d": "巴西国民 DJ，〈Hear Me Now〉，Brazilian bass 代表，近年也走更温暖的 house。"}, "Lost Frequencies": {"o": "比利时", "d": "〈Are You With Me〉〈Where Are You Now〉，温柔的 tropical / deep house，大合唱时刻很多。"}, "Swedish House Mafia": {"o": "瑞典", "d": "〈Don't You Worry Child〉〈One〉〈Save the World〉，三人传奇组合，闭幕大秀。"}, "Agents Of Time": {"o": "意大利", "d": "意大利三人组，以“现场演奏”的 melodic techno 闻名（不是只放音乐），Afterlife 系。"}, "Morten": {"o": "丹麦", "d": "丹麦 DJ，和 David Guetta 一起推出“Future Rave”计划。跟 Kevin de Vries 的 B2B 会是大舞台 × 黑暗 techno 的碰撞。"}, "Dino Lenny": {"o": "意大利", "d": "意大利资深 house DJ / 制作人，优雅的旋律 house。"}, "Maxi Meraki": {"o": "比利时", "d": "比利时制作人，afro / melodic house，温暖有律动，近年很红。"}, "Améme": {"d": "afro house 代表 DJ / 制作人之一，鼓组丰富、很有身体感。"}, "Honeyluv": {"o": "美国", "d": "美国女 DJ，tech house，律动感强、很好跳。"}, "DJ Tennis": {"o": "意大利", "d": "Life and Death 厂牌主理人，indie dance / 电子，带点忧郁的派对音乐，品味派。"}, "Joris Voorn": {"o": "荷兰", "d": "荷兰 techno / house 名家，经典〈Ringo〉，混音细腻，DJ 中的 DJ。"}, "Krystal Klear": {"o": "爱尔兰", "d": "爱尔兰 DJ，disco / house，代表作〈Neutron Dance〉，超开心的律动。"}, "Angemi": {"d": "big room / EDM DJ，曾登 Tomorrowland 主舞台。"}, "Whisnu Santika": {"o": "印尼", "d": "印尼最知名的 EDM DJ 之一，会把印尼 funkot 等在地元素放进 big room，东南亚主场气氛会很好。"}, "Matisse & Sadko": {"o": "俄罗斯", "d": "俄罗斯兄弟档，与 Martin Garrix 合作多首作品（〈Together〉〈Forever〉等），HALŌ 成员。"}, "Lucas & Steve": {"o": "荷兰", "d": "荷兰双人组，Spinnin' Records 出身，轻快的 future house，好入口。"}, "Laidback Luke": {"o": "荷兰", "d": "资深 electro house DJ（荷兰菲律宾裔），Mixmash 厂牌主理人，混音技巧很强。"}, "Quintino": {"o": "荷兰", "d": "荷兰 big room DJ，重拍、直接、适合狂跳。"}, "Brennan Heart": {"o": "荷兰", "d": "Hardstyle 传奇，被称为“Hardstyle 总统”之一。周日 Crystal Garden 收尾，史诗旋律 + 硬核大鼓。"}, "Sabai": {"o": "美国", "d": "美国制作人，melodic bass / future bass，温柔又有重量。"}, "Andromedik": {"o": "比利时", "d": "比利时 drum & bass 制作人，Liquicity 体系，旋律派、很好入坑的 DnB。"}, "Apashe": {"o": "比利时出生、加拿大发展", "d": "把交响乐和重低音 bass 结合，电影感十足，代表作〈No Twerk〉。"}, "Netsky": {"o": "比利时", "d": "比利时 drum & bass 代表人物，〈Come Alive〉，旋律好听、律动强，DnB 入门首选。"}, "Neon": {"d": "曾在 Tomorrowland Winter 演出。"}, "To Be Discovered": {"d": "官方行程表上就写“To Be Discovered”，可能是神秘嘉宾或尚未公布的演出，现场再看。"}, "AdamK": {"o": "加拿大", "d": "加拿大资深 progressive house DJ（Adam K），旋律温暖、律动稳定。"}}, "vibe": {"fri": "主舞台从爵士 house 一路到 Garrix；<b>Crystal Garden = Trance 之夜</b>；Codex 晚上是 tech house；FREEDOM 晚上很硬（Hardstyle → Trap）。", "sat": "<b>Crystal Garden = Psytrance 一整天</b>；FREEDOM 交给 techno 与 hard techno；Codex 晚上是 progressive / big room；主舞台 DVLM、Steve Aoki 压轴。", "sun": "<b>Codex = Drum & Bass / Bass 之夜</b>；FREEDOM 是 melodic techno；CORE 偏 afro / disco 的优雅律动；Crystal Garden 收在 Hardstyle；主舞台 Swedish House Mafia 闭幕。"}}}, "en": {"ui": {"langName": "English", "nav_grid": "Timetable", "nav_now": "Now", "nav_mine": "My Plan", "nav_djs": "DJs", "nav_genre": "Genres", "clock": "Thailand {t}", "dayShort": ["Fri", "Sat", "Sun"], "dayLine": ["Dec 11", "Dec 12", "Dec 13"], "grid_hint": "Tap any set to read about the DJ. Mainstage times are estimated from the official image and may be off by ±10 min.", "all": "All", "limited": "Not much public info on this artist yet: likely a newcomer or local act, which makes it a great chance to discover someone. The genres below are <b>guessed from what this stage is playing that day</b>, not the artist's official style.", "guess_suffix": " (guess)", "other_sets": "Also playing: ", "need_net": "Listening links need internet", "pill_big": "Headliner", "pill_pick": "Worth discovering", "pill_big_s": "Big", "pill_pick_s": "Pick", "min": "{n} min", "fav_on": "♥ In my plan", "fav_off": "♡ Add to my plan", "partner_also": "♥ {p} wants to see this too", "overlap_warn": "⚠︎ Clashes with {x}, which you already picked", "b2b_note": "B2B (back-to-back) = two DJs share the decks and take turns. Usually a one-off pairing.", "can_hear": "Playing this weekend", "t_removed": "Removed from my plan", "t_added_ov": "Added (time clash)", "t_added": "Added to my plan ♥", "t_none": "You haven't picked any sets yet", "t_copied": "Copied: send it to your partner", "t_copy_manual": "Please copy the text in the box", "t_bad_code": "Couldn't read that. It should start with TMLTH:", "t_imported": "Imported {n} sets", "now_live": "Thailand time · {d} is live", "now_drag": "{d} · Drag to see what's on every stage at any time", "countdown": "{n} days to go.", "back_now": "Back to now", "my_next": "My next set", "in_progress": "Live now", "in_min": "in {n} min", "stages": "All stages", "not_started": "Not started yet", "ended": "Done for today", "tz_note": "All times are Thailand time (UTC+7).", "mine_empty": "No sets picked yet.<br>On the Timetable, tap any set and press “♡ Add to my plan”.<br><br>You can each pick on your own phone, then swap lists with “Sync with partner” below to see each other's picks and clashes.", "me": "Me", "both_want": "You both want this", "overlap_with": "⚠︎ Clashes with {x}", "sync_title": "Sync with partner", "sync_desc": "Tap “Copy my list” and send the text to your partner (any chat app works). They paste it in the box below and tap Import, and your picks show up as pink ♥ on their timetable. No account needed; you only need internet to send the message.", "copy_mine": "Copy my list", "partner_name": "Partner's name", "import_ph": "Paste the TMLTH:… text from your partner here", "do_import": "Import partner's list", "clr_partner": "Clear partner's list", "clr_mine": "Clear mine", "confirm_again": "Tap again to confirm", "local_note": "Picks are stored only in this phone's browser. Clearing browser data will erase them.", "partner_default": "Partner", "dj_search_ph": "Search DJ, country, genre…", "f_all": "All", "f_pick": "⭐ Worth discovering", "f_big": "Headliners", "f_today": "Playing {d}", "f_lim": "New faces (little info)", "pick_note": "“Worth discovering” is for people who mostly know the big names. These aren't always the biggest acts, but each one is a great representative of its genre: easy to get into and worth seeing live.", "n_artists": "{n} artists", "no_match": "No matching DJs", "lim_short": "Little public info · a chance to discover", "genre_intro": "Only knowing the mainstream DJs is totally normal. The Mainstage is mostly Big Room / EDM, but every other stage has its own “religion”. Find which style your favorite mainstream tracks belong to, then try new names in the same style.", "routes_title": "Discovery paths from the mainstream", "routes": ["Love the melodies of <b>Martin Garrix / Swedish House Mafia</b> →", "Love <b>Anyma / dark, epic vibes</b> →", "Love <b>the hard parts of DVLM sets</b> →", "Love <b>Vini Vici</b> → Crystal Garden all day Saturday, closed by", "Love <b>Lost Frequencies' softer side</b> →", "Love <b>club grooves like “Cola”</b> →", "Want to try <b>something totally new</b> (DnB, orchestral bass, Thai techno) →"], "k_feel": "Sounds like: ", "k_bpm": "Tempo: ", "k_bpm_v": "about {b} BPM", "k_like": "If you like: ", "k_when": "Where to hear it: ", "see_artists": "See the {n} artists this weekend →", "bpm_note": "BPM = beats per minute; higher is faster. Most pop songs are around 100–120.", "lang_title": "Language", "about_title": "About & install", "unofficial": "This is an unofficial, fan-made timetable and is not affiliated with Tomorrowland. Times are taken from the officially published images (Mainstage times are estimated); always check the official app and on-site announcements.", "install_title": "Add to your Home Screen to use it offline", "installed_ok": "✓ Opened from your Home Screen: works offline.", "tab_ios": "iPhone", "tab_android": "Android", "ios_steps": ["Open this URL in <b>Safari</b>", "Tap the Share button (square with an up arrow). <b>Don't see it? Tap “•••” first, then “Share”</b>", "Scroll down and tap “<b>Add to Home Screen</b>” → “Add”", "Open it once from the new icon so the data is saved"], "android_steps": ["Open this URL in <b>Chrome</b>", "Tap “⋮” at the top right", "Tap “<b>Add to Home screen</b>” or “<b>Install app</b>”", "Open it once from the new icon so the data is saved"], "inapp_warn": "⚠︎ You are in an app's built-in browser (e.g. Instagram, LINE, WeChat), which can't add to the Home Screen. Use the menu at the top right to “Open in browser” and open it in Safari or Chrome.", "storage_note": "“My Plan” is stored only on this phone and is never uploaded. On iPhone, Safari tabs and the Home Screen icon keep separate data, so after installing, always open it from the icon.", "update_note": "When the page is updated, open it once while online and it updates automatically. Open it again on hotel Wi-Fi before you go.", "banner": "Unofficial fan-made guide · Add to Home Screen to use offline", "banner_btn": "How", "close": "Close"}, "content": {"genres": {"bigroom": {"n": "Big Room / EDM", "one": "The classic Mainstage sound: huge drops, everyone jumping, fireworks moments.", "feel": "Build-up → rise → one beat of silence → the bass explodes (the drop). Catchy melodies, often mixed with pop songs.", "like": "Martin Garrix “Animals”, Dimitri Vegas & Like Mike, Afrojack", "when": "Mainstage at night, Crystal Garden on Sunday"}, "prog": {"n": "Progressive House", "one": "More melodic, warm and emotional than Big Room. Perfect for singalongs and sunsets.", "feel": "Piano chords, swelling synths, emotional build-ups; not as loud, but very uplifting.", "like": "Swedish House Mafia “Don't You Worry Child”, Garrix “Forever”, Avicii", "when": "HALŌ on Friday, Codex on Saturday night"}, "house": {"n": "House", "one": "The root of dance music: a steady four-on-the-floor beat that keeps you moving.", "feel": "Steady boom-tss-boom-tss, often with soul or disco vocal samples. It's about groove, not drops.", "like": "Lost Frequencies, Kryder, Fisher", "when": "Papillon all weekend, Codex on Friday"}, "techhouse": {"n": "Tech House", "one": "House groove + Techno's deep low end, with bouncy basslines. Pure club energy.", "feel": "Constantly moving bass, busy percussion, vocals are often one repeated catchphrase.", "like": "CamelPhat “Cola”, Fisher “Losing It”, John Summit", "when": "Codex on Friday night (Solardo, CamelPhat)"}, "melhouse": {"n": "Melodic / Deep House", "one": "Soft, slightly melancholic or dreamy House that's easy on the ears.", "feel": "Warm chords, airy vocals, unhurried. Great for afternoons or a break.", "like": "Lost Frequencies' chill tracks, Bob Moses, Yotto", "when": "Crystal Garden Friday early evening, Papillon on Sunday"}, "afro": {"n": "Afro House", "one": "African percussion + House: tribal feel and lots of body movement.", "feel": "Rich drums, layered rhythms, often chants in African languages.", "like": "Black Coffee, Keinemusik, Adam Port “Move”", "when": "CORE on Sunday (Maxi Meraki, Améme)"}, "meltechno": {"n": "Melodic Techno", "one": "The “dark but beautiful” sound of recent years: epic, hypnotic, cinematic.", "feel": "Deep driving drums and slowly unfolding big melodies. No big drop, but it pulls you all the way in.", "like": "Anyma, ARTBAT “Upperground”, the Afterlife label", "when": "Kevin de Vries on Friday's Mainstage, FREEDOM on Sunday"}, "techno": {"n": "Techno", "one": "Repetitive, hypnotic, industrial. It's all about groove and evolving sounds.", "feel": "Few vocals and minimal melody; subtle changes in drums and texture keep you dancing.", "like": "Amelie Lens, Charlotte de Witte, Lilly Palmer", "when": "FREEDOM on Saturday (Atmosphere)"}, "hardtechno": {"n": "Hard Techno", "one": "Faster, harder, fiercer Techno: today's favorite underground rave sound.", "feel": "Very hard kicks, often with snippets of 90s rave or trance melodies. Physically intense.", "like": "Nico Moreno, Indira Paganotto", "when": "End of FREEDOM on Saturday"}, "trance": {"n": "Trance", "one": "A 90s–00s European classic: the feeling of your heart being lifted.", "feel": "Long build-ups, soaring melodies, huge space and emotional release (uplifting).", "like": "Armin van Buuren, early Tiësto, Above & Beyond", "when": "Crystal Garden all Friday night"}, "psy": {"n": "Psytrance", "one": "Trippy, fast and spinning, born at the hippie parties of Goa, India.", "feel": "Rolling “boom-tick-boom-tick” bass + twisting, swirling effects, like entering another world.", "like": "Vini Vici “The Tribe”, Infected Mushroom", "when": "Crystal Garden all day Saturday"}, "hardstyle": {"n": "Hardstyle", "one": "The hard sound of the Netherlands and Belgium; the kick drum goes “BOOOM” with distortion.", "feel": "Massive distorted kicks + epic melodies; the crowd pumps fists together.", "like": "The hard parts of DVLM sets, Sub Zero Project, Brennan Heart", "when": "FREEDOM Friday night, Saturday Mainstage, Crystal Garden's Sunday closer"}, "dnb": {"n": "Drum & Bass", "one": "Fast broken beats from the UK. The drums are fast but the bass is slow, so you can jump or sway.", "feel": "Broken beats at 174 BPM with heavy basslines; move at half speed or go full speed.", "like": "Netsky “Come Alive”, Pendulum, Chase & Status", "when": "Codex on Sunday night"}, "bass": {"n": "Bass / Dubstep", "one": "Electronic music where the heavy bass is the star: aggressive or very cinematic.", "feel": "Bass that roars, distorts and wobbles, sometimes with orchestral or film-score sounds.", "like": "Skrillex, Apashe, Excision", "when": "Codex on Sunday"}, "trap": {"n": "Trap", "one": "Hip-hop rhythm + EDM drops: made for jumping and headbanging.", "feel": "808 sub bass, fast hi-hats, hip-hop vocal chants.", "like": "DJ Snake “Turn Down for What”, Yellow Claw “Shotgun”", "when": "FREEDOM's Friday closer, Codex's Sunday closer"}, "disco": {"n": "Disco / Indie Dance", "one": "Retro disco, funk and indie electronic: party vibes with taste.", "feel": "Lively basslines, vintage synths; joyful, easy dancing.", "like": "Purple Disco Machine, Daft Punk", "when": "CORE on Sunday night"}, "hardhouse": {"n": "Hard House / Hard Trance", "one": "The hard house/trance revival from the UK: fast and fun.", "feel": "Fast kicks, bouncing bass, nostalgic rave melodies.", "like": "Hannah Laing, Funk Tribu", "when": "FREEDOM on Saturday, CORE on Friday"}, "pop": {"n": "Pop EDM / Vocals", "one": "Singers and choruses, so you've probably heard some of it.", "feel": "Like pop songs, but better for dancing, with lots of singalong moments.", "like": "Alan Walker “Faded”, R3HAB, NERVO", "when": "Mainstage"}, "party": {"n": "Party Anthems / Singalong", "one": "Any genre, any classic. The only goal is to get everyone singing.", "feel": "80s/90s/00s hits, pop songs, cross-genre mashups; fun comes first.", "like": "The last hour of a wedding party (but wilder)", "when": "Moosebar all day"}, "live": {"n": "Live Instruments", "one": "Not just playing tracks: someone plays real instruments live.", "feel": "Saxophone, keys, bass and more improvised over electronic beats.", "like": "Anyone who loves the feel of a live band", "when": "Goldfish opening Friday's Mainstage, Agents Of Time on Sunday"}}, "dj": {"Goldfish": {"o": "South Africa", "d": "A South African duo who play sax, keys and double bass live while DJing, blending jazz instruments into sunny deep house. They open the festival, perfect for an afternoon warm-up."}, "Rave Republic": {"o": "Singapore (Swiss + Australian members)", "d": "A Singapore-based duo, often called one of Asia's most representative EDM duos, with several DJ Mag Top 100 placings. High-energy big room, pop EDM and harder mixes."}, "Youna": {"o": "Belgium", "d": "A Belgian female DJ often seen at Tomorrowland events, moving between house and harder dance sounds."}, "Henri PFR": {"o": "Belgium", "d": "A homegrown Belgian DJ and Tomorrowland Mainstage regular. Melodic, accessible progressive / future house."}, "Lilly Palmer": {"o": "Born in Switzerland, based in Germany", "d": "A female techno DJ who has blown up in recent years: punchy peak-time techno with very catchy melodies or vocal hooks, and lots of viral clips. A friendly way into techno."}, "John Newman": {"o": "UK", "d": "British singer behind “Love Me Again” and the voice on Rudimental's “Feel the Love”. He now plays DJ sets mixing his own hits with house, so expect big singalongs."}, "Kevin de Vries": {"o": "Germany", "d": "One of the core artists of the Afterlife label and a melodic techno heavyweight: dark, epic and driving. If you like Anyma's cinematic feel, don't miss him. He also goes B2B with Morten on Sunday."}, "HALŌ": {"o": "Russia / Netherlands / UK", "d": "A supergroup formed in 2025: Matisse & Sadko (Russian brothers) + DubVision (Dutch brothers) + Third Party (UK duo), playing emotional, euphoric progressive house. Fans of melodic Garrix will love it."}, "Vini Vici": {"o": "Israel", "d": "The duo who brought psytrance to main stages worldwide, known for “The Tribe” and “Great Spirit” with Armin van Buuren. Trippy, spinning and tribal."}, "Alan Walker": {"o": "Norway", "d": "The “Faded” and “Alone” guy, known for his mask and hood. Gentle melodies and plenty of singalongs."}, "Martin Garrix": {"o": "Netherlands", "d": "Rose to fame with “Animals” and has been voted DJ Mag's No.1 several times. Friday's closer, so fireworks are basically guaranteed."}, "Flosstradamus": {"o": "USA", "d": "One of the pioneers of trap EDM and a key figure in bringing trap into mainstream EDM in the 2010s. A B2B with Yellow Claw will go off."}, "Yellow Claw": {"o": "Netherlands", "d": "Amsterdam duo mixing trap, bass and hip-hop, known for “Shotgun”. B2B with Flosstradamus on Friday, closing Codex on Sunday."}, "Da Tweekaz": {"o": "Norway", "d": "A “happy hardstyle” duo who often turn pop songs and childhood favorites into hardstyle. The least scary way to try hardstyle for the first time."}, "MANDY": {"o": "Belgium", "d": "Belgian female hardstyle DJ signed to Dirty Workz, with lots of hard remixes of pop hits (including the official harder remix of Tiësto & Post Malone's “Jackie Chan”)."}, "Bassjackers": {"o": "Netherlands", "d": "One of the Dutch big room / electro names and a familiar face on the Tomorrowland Mainstage: heavy beats and straight-up energy."}, "Honey Gee": {"d": "Has appeared on Yves V's hosted stage at Tomorrowland Belgium (EDM / big room)."}, "Raiden": {"o": "South Korea", "d": "Korean DJ/producer who has worked with many K-pop artists (e.g. “Yours” with EXO's Chanyeol). Pop-leaning EDM / future bass."}, "Kryder": {"o": "UK", "d": "Veteran British house DJ and host of the radio show Kryteria. Started in progressive, now plays groovy house / tech house."}, "Funk Tribu": {"o": "From Colombia, based in Berlin", "d": "Famous for “Phonky Tribu” and a face of today's “groovy trance”: retro-futuristic 90s–00s vibes with a bouncy groove. Closes CORE on Friday."}, "X CLUB.": {"o": "Australia (based in the UK)", "d": "An Australian duo starting from 90s techno and mixing in breakbeat, jungle and trance: “fun techno” that never feels cold."}, "Pegassi": {"o": "Belgium", "d": "The project of Belgian producer Sam Huybrecht, mixing eurodance, trance, techno and house: nostalgic and punchy."}, "Hyalyte": {"d": "Has played the CORE stage at Tomorrowland Winter."}, "Ferry Corsten": {"o": "Netherlands", "d": "A trance legend known for classics like System F “Out of the Blue” and Gouryella. Closes Crystal Garden at midnight on Friday, after a B2B with Marsh."}, "Marsh": {"o": "UK", "d": "A producer from the Anjunadeep / Anjunabeats family: delicate, melodic progressive / deep house, perfect at sunset."}, "Aly & Fila": {"o": "Egypt", "d": "Egyptian trance duo behind “Future Sound of Egypt” who have played in front of the Pyramids. Soaring uplifting trance; legends among trance fans."}, "Cosmic Gate": {"o": "Germany", "d": "German trance duo active since 1999, known for “Exploration of Space”. Powerful, tech-leaning trance."}, "Eli & Fur": {"o": "UK", "d": "British female duo: dreamy vocals + deep / melodic house, gentle but groovy."}, "Yotto": {"o": "Finland", "d": "Finnish producer from Anjunadeep, a leading name in melodic house / progressive with clean, beautiful melodies."}, "CamelPhat": {"o": "Liverpool, UK", "d": "The Grammy-nominated duo behind “Cola”, leaders of tech house and melodic club music. Maximum club atmosphere."}, "Solardo": {"o": "Manchester, UK", "d": "British tech house duo running the Sola label: bouncy bass, hard-hitting rhythms, made for dancing."}, "Linska": {"o": "UK", "d": "A fast-rising female DJ playing upbeat, punchy house / tech house."}, "Lennert Wolfs": {"d": "Has played at Tomorrowland Winter."}, "Jelle DK": {"o": "Belgium", "d": "Moosebar resident. Moosebar is Tomorrowland's Canadian hunting-lodge bar, playing cross-genre party anthems for big singalongs and good times."}, "Jan V": {"o": "Belgium", "d": "Moosebar resident, playing all three days. Tired and want a drink, some nostalgic hits and a singalong? Head to Moosebar."}, "Jerrooo": {"o": "Belgium", "d": "Moosebar resident who also plays the Moose Bar at Tomorrowland Belgium. Party anthems and cross-genre mashups."}, "Ian Asher": {"o": "USA", "d": "American DJ/producer playing upbeat, accessible house / future house."}, "Miss Monique": {"o": "Ukraine", "d": "Ukrainian female DJ who grew famous through her YouTube “Mind Space” series. Progressive / melodic techno that's beautiful and punchy, a great intro to melodic techno."}, "NERVO": {"o": "Australia", "d": "Australian twin sisters and songwriters (co-writers of David Guetta's “When Love Takes Over”). Poppy, feel-good EDM."}, "Sub Zero Project": {"o": "Netherlands", "d": "Dutch hardstyle duo and Defqon.1 favorites, known for “The Project”. Hard but with epic melodies; the best Mainstage intro to hardstyle."}, "ARTBAT": {"o": "Ukraine", "d": "Melodic techno superstars known for “Upperground”: epic, deep and cinematic. On the Mainstage Saturday, plus a B2B with R3HAB on Sunday."}, "Afrojack": {"o": "Netherlands", "d": "Producer of “Take Over Control” and Pitbull's “Give Me Everything”, an electro / big room icon."}, "Dimitri Vegas & Like Mike": {"o": "Belgium (brothers of Greek descent)", "d": "Known as the “Kings of Tomorrowland” and former DJ Mag No.1. Big room, hardstyle and pop all mixed together in an over-the-top show."}, "Steve Aoki": {"o": "USA", "d": "Founder of Dim Mak, famous for throwing cakes from the stage. EDM, rock and hip-hop crossover; Saturday's closer."}, "Nakadia": {"o": "Thailand (based in Berlin)", "d": "A Thai female techno DJ based in Berlin, one of the few Thai names on the international techno scene. This is a homecoming show, so expect an emotional set."}, "Amber Broos": {"o": "Belgium", "d": "Young Belgian female techno DJ and Tomorrowland regular, playing high-energy peak-time techno."}, "Space 92": {"o": "France", "d": "French techno producer with a huge, industrial and explosive sound."}, "Hannah Laing": {"o": "Scotland, UK", "d": "A leading female DJ of the UK hard house / hard trance revival. Fast and fun, so bring your stamina."}, "Nico Moreno": {"o": "France", "d": "French hard techno heavyweight: fast, fierce, one of the hottest names in hard techno right now."}, "Luuk van Dijk": {"o": "Netherlands", "d": "Dutch DJ playing house / tech house with disco and retro touches. Very groovy."}, "DJ Boring": {"o": "Born in Australia, based in London", "d": "Rose to fame with the lo-fi house classic “Winona”. His sets have become faster and more rave, but keep a nostalgic warmth."}, "Mind Against": {"o": "Italy", "d": "Italian brothers from the Afterlife family, masters of melodic techno: deep, dark and atmospheric. Closing CORE on Saturday."}, "Firaga": {"d": "Has played the psytrance stage (Planaxis) at Tomorrowland Belgium."}, "Ghost Rider": {"o": "Israel", "d": "Israeli psytrance producer with a progressive / full-on psychedelic style."}, "Blastoyz": {"o": "Israel", "d": "Israeli psytrance producer with a melodic, mainstream-friendly sound. Many fans got into psytrance through him."}, "Vegas": {"d": "Psytrance DJ who has been in the DJ Mag Top 100 and has played several Tomorrowland editions."}, "Infected Mushroom": {"o": "Israel", "d": "Legendary psytrance duo since 1996, known for “Becoming Insane”. Psychedelic with a rock edge; closing Crystal Garden on Saturday."}, "Manuals": {"d": "Has played Tomorrowland Belgium and Tomorrowland Winter."}, "Nome.": {"d": "Has played Tomorrowland Belgium."}, "22 Bullets": {"o": "Belgium", "d": "Belgian big room / EDM DJ with direct, Mainstage-style energy."}, "DubVision": {"o": "The Hague, Netherlands", "d": "Dutch brothers playing progressive house, and members of the supergroup HALŌ."}, "Yves V": {"o": "Belgium", "d": "A Tomorrowland veteran and the first Belgian DJ to play its Mainstage. Classic Tomorrowland party energy."}, "Third Party": {"o": "London, UK", "d": "British duo making highly melodic progressive house, and members of HALŌ."}, "DVBBS": {"o": "Canada", "d": "Canadian brothers known for “Tsunami”, closing Codex on Saturday."}, "Halo": {"d": "Note: this is spelled differently from Friday's HALŌ (no macron), so it may not be the same act. There is also a well-known Chinese house producer called Halo, but we can't confirm who this is."}, "Mattn": {"o": "Belgium", "d": "Belgian DJ/producer playing big room / EDM, often seen at Tomorrowland events."}, "Kölsch": {"o": "Denmark", "d": "Danish producer known for warm, nostalgic and epic melodic techno / house. A rare “beautiful” sound on the Mainstage, highly recommended."}, "R3HAB": {"o": "Netherlands", "d": "Prolific pop EDM producer who has remixed countless pop hits. On the Mainstage Sunday, then a rare B2B with ARTBAT."}, "Alok": {"o": "Brazil", "d": "Brazil's national DJ, known for “Hear Me Now”, the face of Brazilian bass, now also playing warmer house."}, "Lost Frequencies": {"o": "Belgium", "d": "“Are You With Me”, “Where Are You Now”: gentle tropical / deep house with lots of singalong moments."}, "Swedish House Mafia": {"o": "Sweden", "d": "“Don't You Worry Child”, “One”, “Save the World”: the legendary trio, closing the festival."}, "Agents Of Time": {"o": "Italy", "d": "Italian trio known for melodic techno performed live (not just DJing), part of the Afterlife family."}, "Morten": {"o": "Denmark", "d": "Danish DJ who launched the “Future Rave” project with David Guetta. His B2B with Kevin de Vries will be a clash of big-stage energy and dark techno."}, "Dino Lenny": {"o": "Italy", "d": "Veteran Italian house DJ/producer playing elegant melodic house."}, "Maxi Meraki": {"o": "Belgium", "d": "Belgian producer of afro / melodic house: warm, groovy, and very popular lately."}, "Améme": {"d": "One of the leading afro house DJs/producers: rich drums and a very physical groove."}, "Honeyluv": {"o": "USA", "d": "American female DJ playing groovy, very danceable tech house."}, "DJ Tennis": {"o": "Italy", "d": "Founder of the Life and Death label: indie dance / electronic, slightly melancholic party music for people with taste."}, "Joris Voorn": {"o": "Netherlands", "d": "Dutch techno / house master known for the classic “Ringo”. Meticulous mixing; a DJ's DJ."}, "Krystal Klear": {"o": "Ireland", "d": "Irish DJ playing disco / house, known for “Neutron Dance”. Super joyful grooves."}, "Angemi": {"d": "Big room / EDM DJ who has played the Tomorrowland Mainstage."}, "Whisnu Santika": {"o": "Indonesia", "d": "One of Indonesia's best-known EDM DJs, bringing Indonesian funkot and other local flavors into big room. Expect a great Southeast Asian home crowd."}, "Matisse & Sadko": {"o": "Russia", "d": "Russian brothers who have made several tracks with Martin Garrix (“Together”, “Forever” and more); members of HALŌ."}, "Lucas & Steve": {"o": "Netherlands", "d": "Dutch duo from Spinnin' Records playing upbeat, accessible future house."}, "Laidback Luke": {"o": "Netherlands", "d": "Veteran electro house DJ (Dutch-Filipino) and founder of the Mixmash label, with serious mixing skills."}, "Quintino": {"o": "Netherlands", "d": "Dutch big room DJ: heavy, direct, made for going wild."}, "Brennan Heart": {"o": "Netherlands", "d": "A hardstyle legend, often called one of the “presidents of hardstyle”. Closing Crystal Garden on Sunday with epic melodies and hard kicks."}, "Sabai": {"o": "USA", "d": "American producer of melodic bass / future bass: gentle but heavy."}, "Andromedik": {"o": "Belgium", "d": "Belgian drum & bass producer from the Liquicity family: melodic and a very easy way into DnB."}, "Apashe": {"o": "Born in Belgium, based in Canada", "d": "Combines orchestral music with heavy bass for a very cinematic sound; known for “No Twerk”."}, "Netsky": {"o": "Belgium", "d": "Belgium's drum & bass figurehead, known for “Come Alive”. Great melodies and strong grooves; the best intro to DnB."}, "Neon": {"d": "Has played at Tomorrowland Winter."}, "To Be Discovered": {"d": "The official timetable literally says “To Be Discovered”: probably a secret guest or an unannounced act. Check on the day."}, "AdamK": {"o": "Canada", "d": "Veteran Canadian progressive house DJ (Adam K): warm melodies and a steady groove."}}, "vibe": {"fri": "Mainstage goes from jazzy house all the way to Garrix; <b>Crystal Garden = Trance night</b>; Codex turns tech house at night; FREEDOM gets hard at night (Hardstyle → Trap).", "sat": "<b>Crystal Garden = Psytrance all day</b>; FREEDOM belongs to techno and hard techno; Codex goes progressive / big room at night; DVLM and Steve Aoki close the Mainstage.", "sun": "<b>Codex = Drum & Bass / Bass night</b>; FREEDOM is melodic techno; CORE leans into elegant afro / disco grooves; Crystal Garden ends with Hardstyle; Swedish House Mafia close the festival."}}}, "ja": {"ui": {"langName": "日本語", "nav_grid": "タイムテーブル", "nav_now": "いま", "nav_mine": "マイプラン", "nav_djs": "DJ図鑑", "nav_genre": "ジャンル", "clock": "タイ {t}", "dayShort": ["金曜", "土曜", "日曜"], "dayLine": ["12/11（金）", "12/12（土）", "12/13（日）"], "grid_hint": "枠をタップするとDJ紹介が見られます。メインステージの時間は公式画像からの推定で、±10分ずれる可能性があります。", "all": "すべて", "limited": "公開情報が少ないアーティストです。新人や地元アーティストの可能性が高く、むしろ新しい出会いのチャンス。下のジャンルは<b>このステージのその日の傾向からの推測</b>で、本人の公式ジャンルではありません。", "guess_suffix": "（推測）", "other_sets": "ほかの出演：", "need_net": "試聴リンクはネット接続が必要です", "pill_big": "ヘッドライナー", "pill_pick": "おすすめ発見", "pill_big_s": "大物", "pill_pick_s": "推し", "min": "{n}分", "fav_on": "♥ マイプランに追加済み", "fav_off": "♡ マイプランに追加", "partner_also": "♥ {p}もこのステージを見たい", "overlap_warn": "⚠︎ 選択済みの {x} と時間がかぶっています", "b2b_note": "B2B（バック・トゥ・バック）＝ 2組のDJが同じステージで交互に曲をかけること。多くは限定の組み合わせです。", "can_hear": "今回聴けるアーティスト", "t_removed": "マイプランから削除しました", "t_added_ov": "追加しました（時間がかぶっています）", "t_added": "マイプランに追加しました ♥", "t_none": "まだステージを選んでいません", "t_copied": "コピーしました。相手に送ってね", "t_copy_manual": "枠内の文字を手動でコピーしてください", "t_bad_code": "読み取れませんでした。TMLTH: で始まっているか確認してください", "t_imported": "{n}ステージを取り込みました", "now_live": "タイ時間 · {d} 開催中", "now_drag": "{d} · スライドすると、その時間に各ステージで誰が出ているか見られます", "countdown": "開幕まであと{n}日。", "back_now": "現在に戻る", "my_next": "次のマイステージ", "in_progress": "出演中", "in_min": "あと{n}分", "stages": "各ステージ", "not_started": "まだ始まっていません", "ended": "本日は終了", "tz_note": "時間はすべてタイ時間（UTC+7）です。日本より2時間遅れです。", "mine_empty": "まだステージを選んでいません。<br>「タイムテーブル」で枠をタップし、「♡ マイプランに追加」を押してください。<br><br>2人それぞれのスマホで選んで、下の「2人で共有」で取り込み合えば、お互いの見たいステージとかぶりが分かります。", "me": "自分", "both_want": "2人とも見たい", "overlap_with": "⚠︎ {x} とかぶっています", "sync_title": "2人で共有", "sync_desc": "「リストをコピー」を押して、その文字列を相手に送ります（LINEでOK）。相手が下の欄に貼り付けて「取り込む」を押すと、タイムテーブルにピンクの♥で表示されます。アカウント不要。ネットが必要なのはメッセージを送るときだけです。", "copy_mine": "リストをコピー", "partner_name": "相手の名前", "import_ph": "相手から届いた TMLTH:… をここに貼り付け", "do_import": "相手のリストを取り込む", "clr_partner": "相手のリストを消去", "clr_mine": "自分のを消去", "confirm_again": "もう一度押して確定", "local_note": "選択はこのスマホのブラウザにだけ保存されます。ブラウザのデータを消すと一緒に消えます。", "partner_default": "パートナー", "dj_search_ph": "DJ名・国・ジャンルで検索…", "f_all": "すべて", "f_pick": "⭐ おすすめ発見", "f_big": "ヘッドライナー", "f_today": "{d}出演", "f_lim": "情報が少ない新顔", "pick_note": "「おすすめ発見」はメジャーなDJしか知らない人向け。必ずしも一番の大物ではありませんが、それぞれのジャンルを代表する存在で、入りやすく、生で聴く価値があります。", "n_artists": "{n}組", "no_match": "該当するDJがいません", "lim_short": "公開情報少なめ · 発掘候補", "genre_intro": "メジャーなDJしか知らなくても大丈夫。メインステージはほぼ Big Room / EDM ですが、ほかのステージにはそれぞれの「宗派」があります。好きなヒット曲がどのジャンルか分かれば、同じジャンルの新しい名前を探せます。", "routes_title": "メジャーから広げる発見ルート", "routes": ["<b>Martin Garrix / Swedish House Mafia</b> のメロディが好き →", "<b>Anyma / ダークで壮大な感じ</b>が好き →", "<b>DVLM のハードなパート</b>が好き →", "<b>Vini Vici</b> が好き → 土曜は一日中 Crystal Garden、トリは", "<b>Lost Frequencies のやさしさ</b>が好き →", "<b>「Cola」みたいなクラブのグルーヴ</b>が好き →", "<b>まったく知らないもの</b>を試したい（DnB、オーケストラ系ベース、タイのテクノ）→"], "k_feel": "どんな音：", "k_bpm": "テンポ：", "k_bpm_v": "約{b} BPM", "k_like": "こんな人に：", "k_when": "今回どこで聴ける：", "see_artists": "今回の{n}組を見る →", "bpm_note": "BPM ＝ 1分間の拍数。数字が大きいほど速い。一般的なポップスは100〜120くらいです。", "lang_title": "言語 / Language", "about_title": "このアプリについて・インストール", "unofficial": "これはファンが作った非公式のタイムテーブルで、Tomorrowland 公式とは関係ありません。時間は公式発表の画像をもとに整理しています（メインステージは推定）。実際の時間は公式アプリと現地のアナウンスを確認してください。", "install_title": "ホーム画面に追加すれば、ネットなしでも使えます", "installed_ok": "✓ ホーム画面から開いています。オフラインで使えます。", "tab_ios": "iPhone", "tab_android": "Android", "ios_steps": ["<b>Safari</b> でこのURLを開く", "下の「共有」ボタン（四角に上向き矢印）をタップ。<b>見当たらない場合は、先に「•••」をタップしてから「共有」</b>", "下にスクロールして「<b>ホーム画面に追加</b>」→「追加」", "新しいアイコンから一度開くと、データがスマホに保存されます"], "android_steps": ["<b>Chrome</b> でこのURLを開く", "右上の「⋮」をタップ", "「<b>ホーム画面に追加</b>」または「<b>アプリをインストール</b>」をタップ", "新しいアイコンから一度開くと、データがスマホに保存されます"], "inapp_warn": "⚠︎ いまアプリ内ブラウザ（LINE、Instagram など）で開いているため、ホーム画面に追加できません。右上のメニューから「ブラウザで開く」を選び、Safari か Chrome で開いてください。", "storage_note": "「マイプラン」はこのスマホの中にだけ保存され、アップロードされません。iPhone では Safari のタブとホーム画面のアイコンでデータが別々なので、追加したあとは必ずアイコンから開いてください。", "update_note": "ページが更新されたときは、ネットのある場所で一度開けば自動で更新されます。出発前にホテルのWi-Fiでもう一度開いておくのがおすすめです。", "banner": "非公式のファンメイド · ホーム画面に追加でオフライン利用OK", "banner_btn": "やり方", "close": "閉じる"}, "content": {"genres": {"bigroom": {"n": "Big Room / EDM", "one": "メインステージの定番サウンド。大きなドロップ、全員でジャンプ、花火の瞬間。", "feel": "ビルドアップ → 盛り上げ → 一瞬の静寂 → 重低音が爆発（ドロップ）。覚えやすいメロディで、ポップスも混ざります。", "like": "Martin Garrix「Animals」、Dimitri Vegas & Like Mike、Afrojack", "when": "夜のメインステージ、日曜の Crystal Garden"}, "prog": {"n": "Progressive House", "one": "Big Room よりメロディアスで温かく、エモーショナル。大合唱や夕暮れにぴったり。", "feel": "ピアノのコード、徐々に広がるシンセ、感情の積み上げ。うるさくないのに壮大。", "like": "Swedish House Mafia「Don't You Worry Child」、Garrix「Forever」、Avicii", "when": "金曜の HALŌ、土曜夜の Codex"}, "house": {"n": "House", "one": "ダンスミュージックの「本家」。4つ打ちのビートでずっと揺れていられます。", "feel": "安定したドン・ツ・ドン・ツ。ソウルやディスコの声ネタが多め。ドロップより、グルーヴで踊らせる音楽。", "like": "Lost Frequencies、Kryder、Fisher", "when": "Papillon 全日、金曜の Codex"}, "techhouse": {"n": "Tech House", "one": "House のグルーヴ ＋ Techno の重さ。ベースラインが弾むクラブサウンド。", "feel": "ベースが常に動き、打楽器が細かく、声は短いフレーズの繰り返しが多い。", "like": "CamelPhat「Cola」、Fisher「Losing It」、John Summit", "when": "金曜夜の Codex（Solardo、CamelPhat）"}, "melhouse": {"n": "Melodic / Deep House", "one": "やわらかく、少し切ないまたは夢見心地な House。耳に心地いい。", "feel": "温かいコード、浮遊感のあるボーカル、ゆったりしたテンポ。午後や休憩にぴったり。", "like": "Lost Frequencies のチルな曲、Bob Moses、Yotto", "when": "金曜夕方の Crystal Garden、日曜の Papillon"}, "afro": {"n": "Afro House", "one": "アフリカの打楽器 ＋ House。民族的で体が自然に動くリズム。", "feel": "豊かなドラム、重なり合うリズム、アフリカの言語のチャントも多い。", "like": "Black Coffee、Keinemusik、Adam Port「Move」", "when": "日曜の CORE（Maxi Meraki、Améme）"}, "meltechno": {"n": "Melodic Techno", "one": "近年いちばん熱い「ダークだけど美しい」電子音楽。壮大で催眠的、映画のよう。", "feel": "重く進むドラムと、ゆっくり広がる大きなメロディ。大きなドロップはないけれど、どっぷり引き込まれます。", "like": "Anyma、ARTBAT「Upperground」、Afterlife レーベル", "when": "金曜メインの Kevin de Vries、日曜の FREEDOM"}, "techno": {"n": "Techno", "one": "反復的で催眠的、インダストリアル。グルーヴと音色の変化がすべて。", "feel": "ボーカル少なめ、メロディは最小限。ドラムと音の細かな変化で踊り続けさせます。", "like": "Amelie Lens、Charlotte de Witte、Lilly Palmer", "when": "土曜の FREEDOM（Atmosphere）"}, "hardtechno": {"n": "Hard Techno", "one": "より速く、硬く、激しい Techno。いま若者に一番人気のアンダーグラウンドの音。", "feel": "とても硬いキック、90年代レイヴやトランスのメロディ断片も。体力勝負。", "like": "Nico Moreno、Indira Paganotto", "when": "土曜 FREEDOM のラスト"}, "trance": {"n": "Trance", "one": "90〜00年代ヨーロッパの定番。「心が引き上げられる」感覚。", "feel": "長いビルドアップ、高揚するメロディ、広大な空間と感情の解放（アップリフティング）。", "like": "Armin van Buuren、初期の Tiësto、Above & Beyond", "when": "金曜夜の Crystal Garden"}, "psy": {"n": "Psytrance", "one": "サイケデリックで速く、回転するような音。インド・ゴアのヒッピーパーティー発祥。", "feel": "転がる「ドン・チキ・ドン・チキ」のベース ＋ ねじれて渦巻く効果音。別世界に入るよう。", "like": "Vini Vici「The Tribe」、Infected Mushroom", "when": "土曜は一日中 Crystal Garden"}, "hardstyle": {"n": "Hardstyle", "one": "オランダ・ベルギー発のハードな電子音楽。キックが「ドーン」と歪んで迫力満点。", "feel": "超重量級の歪んだキック ＋ 壮大なメロディ。会場みんなで拳を突き上げます。", "like": "DVLM のハードなパート、Sub Zero Project、Brennan Heart", "when": "金曜夜の FREEDOM、土曜メイン、日曜 Crystal Garden のトリ"}, "dnb": {"n": "Drum & Bass", "one": "イギリス発の高速ブレイクビーツ。ドラムは速いのにベースはゆっくり。跳んでも揺れてもOK。", "feel": "174 BPM のブレイクビーツに重いベースライン。半分の速さで揺れても、全速で跳んでも。", "like": "Netsky「Come Alive」、Pendulum、Chase & Status", "when": "日曜夜の Codex"}, "bass": {"n": "Bass / Dubstep", "one": "重低音が主役の電子音楽。凶暴、または映像的。", "feel": "ベースが唸り、歪み、うねる（ウォブル）。オーケストラや映画音楽風のサウンドと組み合わせることも。", "like": "Skrillex、Apashe、Excision", "when": "日曜の Codex"}, "trap": {"n": "Trap", "one": "ヒップホップのリズム ＋ EDM のドロップ。ジャンプやヘドバンに最適。", "feel": "808の重低音、速いハイハット、ヒップホップの掛け声。", "like": "DJ Snake「Turn Down for What」、Yellow Claw「Shotgun」", "when": "金曜 FREEDOM のトリ、日曜 Codex のトリ"}, "disco": {"n": "Disco / Indie Dance", "one": "レトロなディスコ、ファンク、インディー系エレクトロ。パーティー感があってセンスがいい。", "feel": "弾むベース、ヴィンテージなシンセ。楽しく、無理なく踊れます。", "like": "Purple Disco Machine、Daft Punk", "when": "日曜夜の CORE"}, "hardhouse": {"n": "Hard House / Hard Trance", "one": "イギリスで復活中のハードなハウス／トランス。速くて楽しい。", "feel": "速いキック、跳ねるベース、懐かしいレイヴのメロディ。", "like": "Hannah Laing、Funk Tribu", "when": "土曜の FREEDOM、金曜の CORE"}, "pop": {"n": "ポップEDM / ボーカル", "one": "歌手がいてサビがある。聴いたことがある可能性大。", "feel": "ポップスのようで、より踊りやすい。大合唱の瞬間がたくさん。", "like": "Alan Walker「Faded」、R3HAB、NERVO", "when": "メインステージ"}, "party": {"n": "パーティーアンセム / 大合唱", "one": "ジャンル不問、名曲なら何でも。目的は会場みんなで歌うこと。", "feel": "80〜00年代のヒット曲、ポップス、ジャンルをまたいだマッシュアップ。楽しさ最優先。", "like": "結婚式二次会のラスト1時間（でももっとクレイジー）", "when": "Moosebar 全日"}, "live": {"n": "生楽器", "one": "曲をかけるだけでなく、本物の楽器を生演奏します。", "feel": "サックス、キーボード、ベースなどの即興演奏が電子ビートに重なります。", "like": "バンドのライブ感が好きな人", "when": "金曜メインのオープニング Goldfish、日曜の Agents Of Time"}}, "dj": {"Goldfish": {"o": "南アフリカ", "d": "DJしながらサックス、キーボード、コントラバスを生演奏する南アフリカのデュオ。ジャズの楽器を陽気なディープハウスに溶け込ませます。開幕一番手で、午後のウォームアップに最適。"}, "Rave Republic": {"o": "シンガポール（スイス人＋オーストラリア人）", "d": "シンガポール拠点のデュオで、アジアを代表するEDMデュオの一つ。DJ Mag Top 100 にも何度もランクイン。ハイエナジーなビッグルーム、ポップEDM、ハード寄りのミックス。"}, "Youna": {"o": "ベルギー", "d": "Tomorrowland 系のイベントでよく見かけるベルギーの女性DJ。ハウスとハード寄りのダンスミュージックの間を行き来するスタイル。"}, "Henri PFR": {"o": "ベルギー", "d": "ベルギー生え抜きのDJで、Tomorrowland メインステージの常連。メロディアスで入りやすいプログレッシブ／フューチャーハウス。"}, "Lilly Palmer": {"o": "スイス生まれ、ドイツ拠点", "d": "ここ数年で大ブレイクした女性テクノDJ。パワフルなピークタイム・テクノに中毒性のあるメロディや声ネタを乗せるのが持ち味で、SNSでもよくバズっています。テクノ入門にやさしい存在。"}, "John Newman": {"o": "イギリス", "d": "「Love Me Again」で知られるイギリスの歌手で、Rudimental「Feel the Love」の声の主。最近はDJセットで自分のヒット曲とハウスをミックスするので、大合唱必至。"}, "Kevin de Vries": {"o": "ドイツ", "d": "Afterlife レーベルの中心人物の一人で、メロディック・テクノの代表格。ダークで壮大、推進力抜群。Anyma の映画的な世界観が好きなら必聴。日曜には Morten との B2B も。"}, "HALŌ": {"o": "ロシア / オランダ / イギリス", "d": "2025年結成のスーパーグループ。Matisse & Sadko（ロシアの兄弟）＋ DubVision（オランダの兄弟）＋ Third Party（イギリスのデュオ）が合体し、エモーショナルで多幸感あふれるプログレッシブハウスを鳴らします。メロディ派の Garrix が好きなら絶対ハマります。"}, "Vini Vici": {"o": "イスラエル", "d": "サイトランスを世界のメインステージに押し上げたデュオ。代表曲は「The Tribe」、Armin van Buuren との「Great Spirit」。サイケデリックで渦を巻くような、民族的なサウンド。"}, "Alan Walker": {"o": "ノルウェー", "d": "「Faded」「Alone」の人。マスクとフードがトレードマーク。やさしいメロディで大合唱の瞬間がたくさん。"}, "Martin Garrix": {"o": "オランダ", "d": "「Animals」でブレイクし、DJ Mag 世界1位に何度も輝いたスター。金曜のトリなので花火はほぼ確実。"}, "Flosstradamus": {"o": "アメリカ", "d": "トラップEDMの先駆者の一人で、2010年代にトラップをEDMのメインストリームに持ち込んだ立役者。Yellow Claw との B2B は大爆発間違いなし。"}, "Yellow Claw": {"o": "オランダ", "d": "トラップ、ベース、ヒップホップを横断するアムステルダムのデュオ。代表曲「Shotgun」。金曜は Flosstradamus と B2B、日曜は Codex のトリ。"}, "Da Tweekaz": {"o": "ノルウェー", "d": "「ハッピー系」ハードスタイルのデュオ。ポップスや子どもの頃のヒット曲をハードスタイルにアレンジするのが得意。初めてのハードスタイルに一番こわくない入口。"}, "MANDY": {"o": "ベルギー", "d": "Dirty Workz 所属のベルギー人女性ハードスタイルDJ。ポップスのハードリミックスを多数手がけています（Tiësto & Post Malone「Jackie Chan」の公式ハードリミックスなど）。"}, "Bassjackers": {"o": "オランダ", "d": "オランダのビッグルーム／エレクトロを代表する存在の一つで、Tomorrowland メインステージのおなじみ。重いビートでストレートに盛り上げます。"}, "Honey Gee": {"d": "Tomorrowland ベルギーで Yves V がホストするステージ（EDM／ビッグルーム寄り）に出演経験あり。"}, "Raiden": {"o": "韓国", "d": "多くのK-POPアーティストと共作してきた韓国のDJ／プロデューサー（EXO チャニョルとの「Yours」など）。ポップ感の強いEDM／フューチャーベース。"}, "Kryder": {"o": "イギリス", "d": "ラジオ番組「Kryteria」を持つイギリスのベテラン・ハウスDJ。プログレッシブ出身で、今はグルーヴィーなハウス／テックハウス寄り。"}, "Funk Tribu": {"o": "コロンビア出身、ベルリン拠点", "d": "「Phonky Tribu」でブレイク。最近人気の「グルーヴィー・トランス」の顔で、90〜00年代のレトロフューチャーな空気と弾むリズムが特徴。金曜 CORE のトリ。"}, "X CLUB.": {"o": "オーストラリア（イギリス在住）", "d": "90年代テクノを出発点に、ブレイクビーツ、ジャングル、トランスを混ぜるオーストラリアのデュオ。冷たすぎない「楽しいテクノ」。"}, "Pegassi": {"o": "ベルギー", "d": "ベルギーのプロデューサー Sam Huybrecht のプロジェクト。ユーロダンス、トランス、テクノ、ハウスを混ぜた、懐かしくてパンチのある音。"}, "Hyalyte": {"d": "Tomorrowland Winter の CORE ステージに出演経験あり。"}, "Ferry Corsten": {"o": "オランダ", "d": "System F「Out of the Blue」や Gouryella などの名曲で知られるトランスのレジェンド。金曜深夜の Crystal Garden をしめくくり、その前には Marsh との B2B も。"}, "Marsh": {"o": "イギリス", "d": "Anjunadeep / Anjunabeats 系のプロデューサー。繊細でメロディアスなプログレッシブ／ディープハウスで、夕暮れどきにぴったり。"}, "Aly & Fila": {"o": "エジプト", "d": "「Future Sound of Egypt」を主宰するエジプトのトランスデュオで、ピラミッドの前でも公演した経験あり。高揚感あふれるアップリフティング・トランスで、トランス好きにとっては神的存在。"}, "Cosmic Gate": {"o": "ドイツ", "d": "1999年結成のドイツのトランスデュオ。代表曲「Exploration of Space」。力強く、テック寄りのトランス。"}, "Eli & Fur": {"o": "イギリス", "d": "イギリスの女性デュオ。夢見るようなボーカル ＋ ディープ／メロディックハウスで、やさしくてグルーヴィー。"}, "Yotto": {"o": "フィンランド", "d": "Anjunadeep 出身のフィンランド人プロデューサー。メロディックハウス／プログレッシブの代表格で、クリアで美しいメロディ。"}, "CamelPhat": {"o": "イギリス・リバプール", "d": "「Cola」でグラミー賞にノミネートされたデュオ。テックハウスとメロディック系の代表で、クラブの空気感は最高潮。"}, "Solardo": {"o": "イギリス・マンチェスター", "d": "Sola レーベルを運営するイギリスのテックハウスデュオ。弾むベースと力強いリズムで、踊るのにぴったり。"}, "Linska": {"o": "イギリス", "d": "急上昇中の女性DJ。軽快でパンチのあるハウス／テックハウス。"}, "Lennert Wolfs": {"d": "Tomorrowland Winter に出演経験あり。"}, "Jelle DK": {"o": "ベルギー", "d": "Moosebar のレジデントDJ。Moosebar は Tomorrowland のカナダの狩猟小屋風バーで、ジャンルを問わないパーティーアンセムで大合唱と笑顔があふれる場所。"}, "Jan V": {"o": "ベルギー", "d": "3日間とも出演する Moosebar のレジデント。疲れて一杯飲みたい、懐かしのヒット曲でみんなと歌いたいなら Moosebar へ。"}, "Jerrooo": {"o": "ベルギー", "d": "Tomorrowland ベルギーの Moose Bar でもおなじみのレジデント。パーティーアンセムとジャンル横断のマッシュアップ。"}, "Ian Asher": {"o": "アメリカ", "d": "軽快で入りやすいハウス／フューチャーハウスを鳴らすアメリカのDJ／プロデューサー。"}, "Miss Monique": {"o": "ウクライナ", "d": "YouTube の「Mind Space」シリーズで人気になったウクライナの女性DJ。美しくてパンチのあるプログレッシブ／メロディック・テクノで、メロディック・テクノ入門に最適。"}, "NERVO": {"o": "オーストラリア", "d": "オーストラリアの双子姉妹で、ソングライターでもあります（David Guetta「When Love Takes Over」の共作者）。ポップでハッピーなEDM。"}, "Sub Zero Project": {"o": "オランダ", "d": "Defqon.1 を代表するオランダのハードスタイルデュオで、代表曲は「The Project」。ハードだけどメロディは壮大で、メインステージで聴くハードスタイル入門に最適。"}, "ARTBAT": {"o": "ウクライナ", "d": "「Upperground」で知られるメロディック・テクノのスター。壮大で深く、映画的。土曜はメインステージ、日曜は R3HAB との B2B も。"}, "Afrojack": {"o": "オランダ", "d": "「Take Over Control」や Pitbull「Give Me Everything」のプロデューサーで、エレクトロ／ビッグルームの象徴的存在。"}, "Dimitri Vegas & Like Mike": {"o": "ベルギー（ギリシャ系の兄弟）", "d": "「Tomorrowland の王」と呼ばれ、DJ Mag 世界1位にもなった兄弟。ビッグルーム、ハードスタイル、ポップスを全部ミックスする超派手なショー。"}, "Steve Aoki": {"o": "アメリカ", "d": "Dim Mak レーベルの創設者で、ステージからケーキを投げるのがお約束。EDM、ロック、ヒップホップを横断。土曜のトリ。"}, "Nakadia": {"o": "タイ（ベルリン拠点）", "d": "ベルリンを拠点に活動するタイ人女性テクノDJで、国際的なテクノシーンでは数少ないタイ出身の存在。今回は凱旋公演なので、エモーショナルなセットになりそう。"}, "Amber Broos": {"o": "ベルギー", "d": "Tomorrowland 常連のベルギーの若手女性テクノDJ。エネルギッシュなピークタイム・テクノ。"}, "Space 92": {"o": "フランス", "d": "スケールが大きく、インダストリアルで爆発力のある音を鳴らすフランスのテクノプロデューサー。"}, "Hannah Laing": {"o": "イギリス・スコットランド", "d": "イギリスのハードハウス／ハードトランス復活を代表する女性DJ。速くて楽しいので体力の準備を。"}, "Nico Moreno": {"o": "フランス", "d": "フランスのハードテクノを代表する存在。速くて激しく、いまハードテクノで最も熱い名前の一つ。"}, "Luuk van Dijk": {"o": "オランダ", "d": "ディスコやレトロな要素を取り入れたハウス／テックハウスを鳴らすオランダのDJ。グルーヴ感たっぷり。"}, "DJ Boring": {"o": "オーストラリア生まれ、ロンドン拠点", "d": "ローファイ・ハウスの名曲「Winona」でブレイク。最近のセットはより速くレイヴィーになったものの、懐かしい温かさは健在。"}, "Mind Against": {"o": "イタリア", "d": "Afterlife 系のイタリアの兄弟で、メロディック・テクノの名手。深く、ダークで雰囲気たっぷり。土曜 CORE のトリ。"}, "Firaga": {"d": "Tomorrowland ベルギーのサイトランスステージ（Planaxis）に出演経験あり。"}, "Ghost Rider": {"o": "イスラエル", "d": "プログレッシブ／フルオン系のサイケデリックなスタイルを持つイスラエルのサイトランス・プロデューサー。"}, "Blastoyz": {"o": "イスラエル", "d": "メロディアスでメインストリームにも届くサイトランスを作るイスラエルのプロデューサー
